# ============================================================================
# 示例文件：tests/atk/example_scan/example_scan.yaml
#
# 注意事项：
#   1. 本文件描述"进 ATK 的输入槽位与取值范围"，不是用例设计来源；用例设计在
#      tests/op_cases/<算子>.json（仓内约定），本文件只把已固化的值域交给 ATK。
#   2. shape/dtype/属性取值必须同时满足算子 README、host tiling 校验和 executor 的输入构造。
#   3. 精度标准只写 ATK 原生判据（acc: mixed_tolerance_bm / perf: not_key），不要在 executor 里另造阈值。
#   4. marker 张量（low_precision_marker / fp32_marker）是 ATK 的 dtype 载体，值为 0；
#      真正参与计算的数据由 case_spec 驱动、在 executor 里生成。
#   5. 新增/修改覆盖范围时同步更新 gen_<op>.py、三份 JSON 和算子 ATK README 的覆盖表。
# ============================================================================
api: pytorch
api_type: executor_example_scan
version: v2.1
name: example_scan
aclnn_name:
generate: generator_example_scan
dtype_numbers: 1
extra_numbers: 0
standard:
  acc: mixed_tolerance_bm
  perf: not_key
inputs:
  - name: low_precision_marker
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: fp32_marker
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: case_spec
    type: attr
    required: true
    dtypes:
      values: [non_param]
    ranges:
      valid:
        values: ["{\"name\":\"bf16_bsnd_none\",\"dtype\":\"bf16\",\"B\":1,\"H\":2,\"T\":64,\"D\":128,\"chunk_size\":64,\"layout\":\"BSND\",\"scale\":1.0,\"epsilon\":1e-06,\"keep_saved\":false,\"output_mode\":0,\"op\":\"example_scan\",\"case_id\":0,\"seed\":20260923,\"route\":\"ascendc\",\"soc\":\"ascend910b\"}"]
      invalid:
        values: []
  - name: dtype
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["bf16", "fp16"]
      invalid:
        values: []
  - name: B
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1]
      invalid:
        values: []
  - name: H
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [2]
      invalid:
        values: []
  - name: T
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [64]
      invalid:
        values: []
  - name: D
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [128]
      invalid:
        values: []
  - name: chunk_size
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [64]
      invalid:
        values: []
  - name: layout
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["BSND", "BNSD"]
      invalid:
        values: []
  - name: scale
    type: attr
    required: true
    dtypes:
      values: [float]
    ranges:
      valid:
        values: [1.0]
      invalid:
        values: []
  - name: epsilon
    type: attr
    required: true
    dtypes:
      values: [float]
    ranges:
      valid:
        values: [1.0e-06]
      invalid:
        values: []
  - name: keep_saved
    type: attr
    required: true
    dtypes:
      values: [bool]
    ranges:
      valid:
        values: [false, true]
      invalid:
        values: []
  - name: output_mode
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [0, 1]
      invalid:
        values: []
  - name: case_id
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [0]
      invalid:
        values: []
  - name: seed
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [20260923]
      invalid:
        values: []
  - name: soc
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["ascend910b", "ascend910_93", "ascend950"]
      invalid:
        values: []
  - name: route
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["ascendc"]
      invalid:
        values: []
