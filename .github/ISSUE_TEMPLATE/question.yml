name: 问题咨询
description: 咨询 fla_npu 使用、构建、测试、算子行为或适配问题
title: "[Question]: "
labels:
  - question
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue 类型
      options:
        - question
      default: 0
    validations:
      required: true
  - type: input
    id: branches
    attributes:
      label: 涉及分支
      description: 填写咨询针对的实际仓库分支名；多个分支用逗号分隔。
      placeholder: main 或其他实际存在的分支名
    validations:
      required: true
  - type: input
    id: modules
    attributes:
      label: 涉及算子或模块
      description: 填写算子名或模块名，多个用逗号分隔；已有 op 标签会自动匹配。
      placeholder: chunk_kda_fwd、runtime、build、ci、docs 等
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 请说明当前使用场景、目标、相关算子或调用链。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 请明确你想咨询的问题，以及当前卡住的位置。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望实现的功能
      description: 请说明希望得到的能力、结论、指导或行为。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 推荐的实现方案（可选）
      description: 如已有尝试方案、接口设想或排查思路，请在这里说明。
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: 相关闭环测试建议（可选）
      description: 如有希望覆盖的验证场景、最小样例或回归方式，请在这里说明。
    validations:
      required: false
