name: NPU CI

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to run NPU CI for"
        required: true
      ci_mode:
        description: "CI mode: quick or full"
        required: false
        default: quick
      ops:
        description: "Optional comma-separated operator list"
        required: false
        default: ''

concurrency:
  group: npu-ci-${{ github.repository }}-${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number) || (contains(github.event.comment.body, '/run-npu-ci') && github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 NPU CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.actor != 'github-actions[bot]' &&
        contains(github.event.comment.body, '/run-npu-ci')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      head_repo: ${{ steps.prepare.outputs.head_repo }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      ci_mode: ${{ steps.prepare.outputs.ci_mode }}
      ops: ${{ steps.prepare.outputs.ops }}
      comment_id: ${{ steps.prepare.outputs.comment_id }}
    steps:
      - name: 解析 PR 和 CI 参数
        id: prepare
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const actor = context.actor;
            let actorPermission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              actorPermission = data.permission || 'none';
            } catch (error) {
              core.warning(`Unable to inspect repository permission for ${actor}: ${error.message}`);
            }
            if (actorPermission !== 'admin') {
              core.setFailed(`${actor} 无权触发 NPU CI：需要仓库 Admin 权限，当前权限为 ${actorPermission}。`);
              return;
            }

            const contextName = 'NPU CI / A2+A5 手动验证';
            const accuracyContextName = 'NPU CI / A2+A5 精度检查';
            const platformContract = 'A2+A5';
            let prNumber;
            let ciMode = 'quick';
            let ops = '';
            let commentId = '';
            const upsertComment = async (pr, body) => {
              if (!prNumber || !pr) {
                return '';
              }
              const marker = `<!-- npu-ci:pr=${prNumber}:sha=${pr.head.sha} -->`;
              const fullBody = `${marker}\n${body}`;
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                const existing = comments
                  .filter((comment) =>
                    comment.user &&
                    comment.user.type === 'Bot' &&
                    typeof comment.body === 'string' &&
                    comment.body.includes(marker)
                  )
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: fullBody,
                  });
                  return String(existing.id);
                }

                const { data: comment } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: fullBody,
                });
                return String(comment.id);
              } catch (error) {
                core.warning(`Unable to create or update PR comment: ${error.message}`);
                return '';
              }
            };

            const isActivePendingStatus = async (status) => {
              if (!status || status.state !== 'pending') {
                return false;
              }
              const description = status.description || '';
              if (!description.includes('+example') || !description.includes(platformContract)) {
                return false;
              }
              const targetUrl = status.target_url || '';
              const match = targetUrl.match(/\/actions\/runs\/(\d+)/);
              if (!match) {
                core.warning('NPU CI pending status has no Actions run URL; treating it as active.');
                return true;
              }
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(match[1]),
                });
                return ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status);
              } catch (error) {
                core.warning(`Unable to inspect NPU CI workflow run: ${error.message}`);
                return true;
              }
            };

            if (context.eventName === 'workflow_dispatch') {
              const workflowInputs = context.payload.inputs || {};
              prNumber = Number(workflowInputs.pr_number);
              ciMode = workflowInputs.ci_mode || 'quick';
              ops = workflowInputs.ops || '';
            } else {
              prNumber = context.payload.issue.number;
              const body = (context.payload.comment.body || '').trim();
              if (!body.startsWith('/run-npu-ci')) {
                core.notice('评论包含 /run-npu-ci，但去掉首尾空白后不是以触发命令开头，跳过。');
                core.setOutput('should_run', 'false');
                return;
              }
              const parts = body.split(/\s+/).slice(1);
              for (const part of parts) {
                if (part === 'quick' || part === 'full') {
                  ciMode = part;
                } else if (part.startsWith('ops=')) {
                  ops = part.slice('ops='.length);
                }
              }
            }

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`无效的 PR 编号：${prNumber}`);
              return;
            }
            if (!['quick', 'full'].includes(ciMode)) {
              core.setFailed(`不支持的 CI 模式：${ciMode}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} 仍是草稿，请先标记为 ready for review 后再运行 NPU CI。`);
              return;
            }

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const manualCiStatuses = statuses
              .filter((status) => status.context === contextName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latestExecutionCi = manualCiStatuses
              .find((status) => {
                const description = status.description || '';
                return description.includes('+example') && description.includes(platformContract);
              });
            const accuracyStatuses = statuses
              .filter((status) => status.context === accuracyContextName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latestAccuracyCi = accuracyStatuses
              .find((status) => (status.description || '').includes(platformContract));
            const latestPassedWithExample = latestExecutionCi &&
              latestExecutionCi.state === 'success' &&
              latestAccuracyCi &&
              latestAccuracyCi.state === 'success' &&
              latestExecutionCi.target_url &&
              latestExecutionCi.target_url === latestAccuracyCi.target_url;
            if (latestPassedWithExample) {
              core.notice(`${pr.head.sha} 已经通过 NPU CI 和精度检查，跳过重复运行。`);
              commentId = await upsertComment(
                pr,
                [
                  `NPU CI 和精度检查已经在 \`${pr.head.sha}\` 上通过，本次不会重复运行。`,
                  '',
                  `- 请求模式：\`${ciMode}\``,
                  `- 触发人：@${actor}`,
                  '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                  '- Example ST：已覆盖',
                  '- 精度检查：已覆盖',
                  '- Example ST 用例：全部 enabled 用例',
                ].join('\n')
              );
              core.setOutput('should_run', 'false');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('head_repo', pr.head.repo.full_name);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('ci_mode', ciMode);
              core.setOutput('ops', ops);
              core.setOutput('comment_id', commentId);
              return;
            }
            if (await isActivePendingStatus(latestExecutionCi)) {
              core.notice(`${pr.head.sha} 已经有 NPU CI 在排队或运行，跳过重复启动。`);
              commentId = await upsertComment(
                pr,
                [
                  `NPU CI 已在验证 \`${pr.head.sha}\`，本次评论不会重复启动新任务。`,
                  '',
                  `- 请求模式：\`${ciMode}\``,
                  `- 触发人：@${actor}`,
                  '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                  '- 当前状态：排队或运行中',
                  '- Example ST：必跑',
                  '- Example ST 用例：全部 enabled 用例',
                  latestExecutionCi.target_url ? `- 运行链接：[查看已有 NPU CI](${latestExecutionCi.target_url})` : '',
                ].filter(Boolean).join('\n')
              );
              core.setOutput('should_run', 'false');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('head_repo', pr.head.repo.full_name);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('ci_mode', ciMode);
              core.setOutput('ops', ops);
              core.setOutput('comment_id', commentId);
              return;
            }

            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await Promise.all([
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'pending',
                context: contextName,
                description: `NPU CI 已由 @${actor} 触发 (${ciMode}+example,${platformContract})`,
                target_url: targetUrl,
              }),
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'pending',
                context: accuracyContextName,
                description: `${platformContract} 精度检查等待执行`,
                target_url: targetUrl,
              }),
            ]);
            commentId = await upsertComment(
              pr,
              [
                `NPU CI 已开始验证 \`${pr.head.sha}\`。`,
                '',
                `- 模式：\`${ciMode}\``,
                `- 触发人：@${actor}`,
                '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                '- Example ST：必跑',
                '- Example ST 用例：全部 enabled 用例',
                ops ? `- 算子：\`${ops}\`` : '',
                `- 运行链接：[NPU CI #${context.runNumber}](${targetUrl})`,
              ].filter(Boolean).join('\n')
            );

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('ci_mode', ciMode);
            core.setOutput('ops', ops);
            core.setOutput('comment_id', commentId);

  ascend-npu:
    name: Ascend NPU 验证 (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: a2
            name: A2 / ascend910b
            runner_labels: '["self-hosted","linux","arm64","npu","flash-linear-attention-npu"]'
            soc: ascend910b
            image: fla-npu-ci:9.1.0-910b
            dockerfile: ci/Dockerfile
            require_preloaded_image: 'false'
            tmpdir: ''
          - platform: a5
            name: A5 / ascend950
            runner_labels: '["self-hosted","linux","x64","npu","ascend950","flash-linear-attention-npu-a5"]'
            soc: ascend950
            image: fla-npu-ci:9.1.0-950
            dockerfile: ci/Dockerfile.ascend950
            require_preloaded_image: 'true'
            tmpdir: /tmp/fla-npu-ci
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    env:
      CI_MODE: ${{ needs.prepare.outputs.ci_mode }}
      CI_OPS: ${{ needs.prepare.outputs.ops }}
      CI_SOC: ${{ matrix.soc }}
      FLA_NPU_SOC: ${{ matrix.soc }}
      CI_RUN_EXAMPLE_ST: 'true'
      CI_RUN_STANDALONE_WHEEL_LAYOUT_CHECK: 'true'
      CI_RUN_SCOPED_WHEEL_INSTALL_CHECK: 'true'
      CI_ACCURACY_PLATFORM: ${{ matrix.platform }}
      CI_ACCURACY_REPORT_FILE: .ci-tmp/gdr_accuracy_report-${{ matrix.platform }}.json
      CI_ACCURACY_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      CI_ACCURACY_RUN_ID: ${{ github.run_id }}
      CI_ACCURACY_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: ${{ matrix.image }}
      CI_DOCKERFILE: ${{ matrix.dockerfile }}
      CI_REQUIRE_PRELOADED_IMAGE: ${{ matrix.require_preloaded_image }}
      CI_TMPDIR: ${{ matrix.tmpdir }}
    steps:
      - name: 拉取当前目标分支代码（第 1 次）
        id: checkout_pr_1
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 50
          path: repo

      - name: 启动代理并获取端口
        if: steps.checkout_pr_1.outcome == 'failure' && matrix.platform == 'a2'
        run: |
          # 1. 备份现有环境变量
          echo "========== 备份原有代理配置 =========="
          
          # 备份环境变量
          if [ -n "$http_proxy" ]; then
            export OLD_http_proxy="$http_proxy"
            echo "OLD_http_proxy=$http_proxy" >> $GITHUB_ENV
            echo "备份 http_proxy: $http_proxy"
          fi
          
          if [ -n "$https_proxy" ]; then
            export OLD_https_proxy="$https_proxy"
            echo "OLD_https_proxy=$https_proxy" >> $GITHUB_ENV
            echo "备份 https_proxy: $https_proxy"
          fi
          
          if [ -n "$HTTP_PROXY" ]; then
            export OLD_HTTP_PROXY="$HTTP_PROXY"
            echo "OLD_HTTP_PROXY=$HTTP_PROXY" >> $GITHUB_ENV
            echo "备份 HTTP_PROXY: $HTTP_PROXY"
          fi
          
          if [ -n "$HTTPS_PROXY" ]; then
            export OLD_HTTPS_PROXY="$HTTPS_PROXY"
            echo "OLD_HTTPS_PROXY=$HTTPS_PROXY" >> $GITHUB_ENV
            echo "备份 HTTPS_PROXY: $HTTPS_PROXY"
          fi
          
          if [ -n "$all_proxy" ]; then
            export OLD_all_proxy="$all_proxy"
            echo "OLD_all_proxy=$all_proxy" >> $GITHUB_ENV
            echo "备份 all_proxy: $all_proxy"
          fi
          
          # 备份 Git 代理配置
          echo "========== 备份 Git 代理配置 =========="
          OLD_GIT_HTTP_PROXY=$(git config --global --get http.proxy || echo "")
          OLD_GIT_HTTPS_PROXY=$(git config --global --get https.proxy || echo "")
          
          if [ -n "$OLD_GIT_HTTP_PROXY" ]; then
            echo "OLD_GIT_HTTP_PROXY=$OLD_GIT_HTTP_PROXY" >> $GITHUB_ENV
            echo "备份 git http.proxy: $OLD_GIT_HTTP_PROXY"
          fi
          
          if [ -n "$OLD_GIT_HTTPS_PROXY" ]; then
            echo "OLD_GIT_HTTPS_PROXY=$OLD_GIT_HTTPS_PROXY" >> $GITHUB_ENV
            echo "备份 git https.proxy: $OLD_GIT_HTTPS_PROXY"
          fi
          
          # 2. 启动新代理
          echo "========== 启动新代理 =========="
          # 加载代理配置
          source /etc/profile.d/vpn-proxy.sh
          proxyon
          
          # 从环境变量获取实际端口
          HTTP_PORT=$(echo $http_proxy | sed 's/http:\/\/127.0.0.1://' || echo "7899")
          SOCKS_PORT=$(echo $all_proxy | sed 's/socks5h:\/\/127.0.0.1://' || echo "7891")
          
          # 如果环境变量未设置，从 runtime.yaml 读取
          if [ -z "$HTTP_PORT" ]; then
            HTTP_PORT=$(grep -A5 'proxies:' /root/clashctl/resources/runtime.yaml | grep -m1 'port:' | awk '{print $2}' || echo "7899")
          fi
          
          # 保存到 GITHUB_ENV，供后续步骤使用
          echo "PROXY_HTTP_PORT=$HTTP_PORT" >> $GITHUB_ENV
          echo "PROXY_SOCKS_PORT=$SOCKS_PORT" >> $GITHUB_ENV
          echo "http_proxy=http://127.0.0.1:$HTTP_PORT" >> $GITHUB_ENV
          echo "https_proxy=http://127.0.0.1:$HTTP_PORT" >> $GITHUB_ENV
          echo "all_proxy=socks5h://127.0.0.1:$SOCKS_PORT" >> $GITHUB_ENV
          
          echo "检测到代理端口: HTTP=$HTTP_PORT, SOCKS=$SOCKS_PORT"
          export HOME=${HOME:-/workspace/ci/}
          echo "HOME=$HOME" >> $GITHUB_ENV
          # 配置 Git 代理
          git config --global http.proxy http://127.0.0.1:$HTTP_PORT
          git config --global https.proxy http://127.0.0.1:$HTTP_PORT
          git config --global http.postBuffer 524288000

      - name: 等待后重试拉取目标分支代码
        if: steps.checkout_pr_1.outcome == 'failure'
        run: |
          rm -rf repo
          sleep 15

      - name: 拉取当前目标分支代码（第 2 次）
        id: checkout_pr_2
        if: steps.checkout_pr_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 50
          path: repo

      - name: 再次等待后重试拉取目标分支代码
        if: steps.checkout_pr_1.outcome == 'failure' && steps.checkout_pr_2.outcome == 'failure'
        run: |
          rm -rf repo
          sleep 30

      - name: 拉取当前目标分支代码（第 3 次）
        if: steps.checkout_pr_1.outcome == 'failure' && steps.checkout_pr_2.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 50
          path: repo

      - name: 现场合并 PR 代码
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_head_ref="refs/remotes/pull/${NPU_CI_PR_NUMBER}/head"

          retry_fetch_pr_head() {
            local delay="$1"
            if [ "$delay" != "0" ]; then
              sleep "$delay"
            fi
            git fetch --no-tags --prune --no-recurse-submodules --depth=50 origin \
              "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          }

          fetch_more_history() {
            local deepen_by="$1"
            echo "[CI] Merge base not found in shallow history; deepening by ${deepen_by} commits."
            git fetch --no-tags --prune --no-recurse-submodules --deepen="${deepen_by}" origin \
              "+refs/heads/${NPU_CI_BASE_REF}:refs/remotes/origin/${NPU_CI_BASE_REF}" \
              "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          }

          ensure_merge_base() {
            if git merge-base HEAD "${pr_head_ref}" >/dev/null; then
              return 0
            fi
            for deepen_by in 50 100 200 400 800 1600 3200; do
              fetch_more_history "${deepen_by}"
              if git merge-base HEAD "${pr_head_ref}" >/dev/null; then
                return 0
              fi
            done
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "[CI] Merge base still not found; unshallowing repository as final probe."
              git fetch --no-tags --prune --no-recurse-submodules --unshallow origin \
                "+refs/heads/${NPU_CI_BASE_REF}:refs/remotes/origin/${NPU_CI_BASE_REF}" \
                "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
            fi
            git merge-base HEAD "${pr_head_ref}" >/dev/null
          }

          retry_fetch_pr_head 0 || retry_fetch_pr_head 15 || retry_fetch_pr_head 30
          fetched_head="$(git rev-parse "${pr_head_ref}")"
          if [ "$fetched_head" != "$NPU_CI_TARGET_SHA" ]; then
            echo "[CI][ERROR] PR head changed before merge; target=${NPU_CI_TARGET_SHA}, fetched=${fetched_head}."
            exit 1
          fi
          if ! ensure_merge_base; then
            echo "[CI][ERROR] Unable to find merge base between current base ${NPU_CI_BASE_REF} and PR head after probing history."
            exit 1
          fi

          git merge --no-ff --no-edit "${pr_head_ref}"
        env:
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}

      - name: 拉取可信 CI 脚本（第 1 次）
        id: checkout_trusted_ci_1
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 1
          path: trusted-ci

      - name: 等待后重试拉取可信 CI 脚本
        if: steps.checkout_trusted_ci_1.outcome == 'failure'
        run: |
          rm -rf trusted-ci
          sleep 15

      - name: 拉取可信 CI 脚本（第 2 次）
        id: checkout_trusted_ci_2
        if: steps.checkout_trusted_ci_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 1
          path: trusted-ci

      - name: 再次等待后重试拉取可信 CI 脚本
        if: steps.checkout_trusted_ci_1.outcome == 'failure' && steps.checkout_trusted_ci_2.outcome == 'failure'
        run: |
          rm -rf trusted-ci
          sleep 30

      - name: 拉取可信 CI 脚本（第 3 次）
        if: steps.checkout_trusted_ci_1.outcome == 'failure' && steps.checkout_trusted_ci_2.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ needs.prepare.outputs.base_ref }}
          fetch-depth: 1
          path: trusted-ci

      - name: 使用可信 CI 脚本
        run: |
          # CI 执行脚本必须来自 PR 目标分支，避免 PR 修改脚本后影响 runner，
          # 同时保证维护分支使用与自身代码匹配的 CI 规则。
          # 但 Example/ST 用例配置属于被验证内容：新 PR 中新增或修改的 enabled 用例
          # 必须跟随当前目标分支和 PR head 的现场合并结果一起进入容器，并被 /run-npu-ci quick 实际执行验证。
          tmp_cases="$(mktemp)"
          if [ -f repo/ci/example_st_cases.json ]; then
            cp repo/ci/example_st_cases.json "$tmp_cases"
            python3 -m json.tool "$tmp_cases" >/dev/null
          else
            rm -f "$tmp_cases"
          fi

          rm -rf repo/ci
          cp -a trusted-ci/ci repo/ci

          # 覆盖可信 CI 脚本后，再恢复 PR 自身的 case 文件。
          # 因此后续 PR 只补充 ci/example_st_cases.json 时，NPU CI 会跑到新增用例。
          if [ -f "$tmp_cases" ]; then
            cp "$tmp_cases" repo/ci/example_st_cases.json
          fi

      - name: 运行 ${{ matrix.name }} NPU CI 容器
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_CI_HEAD_POLL_SECONDS: '60'
          CI_CONTAINER_NAME: fla-npu-ci-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$CI_ACCURACY_REPORT_FILE")"
          rm -f "$CI_ACCURACY_REPORT_FILE" "$CI_ACCURACY_REPORT_FILE.tmp"

          get_pr_head_sha() {
            python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["NPU_CI_PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          print(data["head"]["sha"])
          PY
          }

          mark_stale() {
            local current_sha="$1"
            echo "[CI][ERROR] PR head changed while NPU CI was running; target=${NPU_CI_TARGET_SHA}, current=${current_sha}."
            {
              echo "NPU_CI_STALE=true"
              echo "NPU_CI_STALE_HEAD=${current_sha}"
            } >>"$GITHUB_ENV"
            docker rm -f "$CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          if current_sha="$(get_pr_head_sha)"; then
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              mark_stale "$current_sha"
              exit 1
            fi
          else
            echo "[CI][WARN] Unable to check PR head before starting NPU CI; continuing."
          fi

          bash ci/run_ci_container.sh &
          ci_pid=$!
          stale=0
          while kill -0 "$ci_pid" >/dev/null 2>&1; do
            sleep "$NPU_CI_HEAD_POLL_SECONDS"
            if ! kill -0 "$ci_pid" >/dev/null 2>&1; then
              break
            fi
            if ! current_sha="$(get_pr_head_sha)"; then
              echo "[CI][WARN] Unable to check PR head while NPU CI is running; continuing."
              continue
            fi
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              stale=1
              mark_stale "$current_sha"
              wait "$ci_pid" || true
              break
            fi
          done

          if [[ "$stale" == "1" ]]; then
            exit 1
          fi
          wait "$ci_pid"

      - name: 记录 ${{ matrix.name }} 执行结果
        if: always()
        env:
          NPU_PLATFORM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p repo/.ci-tmp
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["CI_ACCURACY_PLATFORM"]
          result = {
              "schema": "npu-ci-platform-result-v1",
              "metadata": {
                  "platform": platform,
                  "soc": os.environ["CI_SOC"],
                  "head_sha": os.environ["CI_ACCURACY_HEAD_SHA"],
                  "run_id": os.environ["CI_ACCURACY_RUN_ID"],
                  "run_attempt": os.environ["CI_ACCURACY_RUN_ATTEMPT"],
              },
              "status": os.environ["NPU_PLATFORM_JOB_STATUS"],
          }
          path = Path("repo/.ci-tmp") / f"npu-ci-result-{platform}.json"
          tmp_path = path.with_suffix(path.suffix + ".tmp")
          tmp_path.write_text(json.dumps(result, indent=2), encoding="utf-8")
          tmp_path.replace(path)
          PY

      - name: 上传 ${{ matrix.name }} 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-ci-result-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repo/.ci-tmp/npu-ci-result-${{ matrix.platform }}.json
            repo/${{ env.CI_ACCURACY_REPORT_FILE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  finalize:
    name: 汇总 A2 + A5 NPU CI
    needs: [prepare, ascend-npu]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: 下载双平台结果
        id: download_results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: npu-ci-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: accuracy-reports
          merge-multiple: true

      - name: 发布双平台 NPU CI 状态
        if: always()
        uses: actions/github-script@v7
        env:
          NPU_MATRIX_RESULT: ${{ needs.ascend-npu.result }}
          NPU_EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_EXPECTED_RUN_ID: ${{ github.run_id }}
          NPU_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const mode = ${{ toJson(needs.prepare.outputs.ci_mode) }};
            const ops = ${{ toJson(needs.prepare.outputs.ops) }};
            const prNumber = ${{ toJson(needs.prepare.outputs.pr_number) }};
            const commentId = ${{ toJson(needs.prepare.outputs.comment_id) }};
            const sha = process.env.NPU_EXPECTED_HEAD_SHA;
            const expectedRunId = process.env.NPU_EXPECTED_RUN_ID;
            const expectedRunAttempt = process.env.NPU_EXPECTED_RUN_ATTEMPT;
            const matrixResult = process.env.NPU_MATRIX_RESULT || 'failure';
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const platformDefs = [
              { key: 'a2', label: 'A2', soc: 'ascend910b' },
              { key: 'a5', label: 'A5', soc: 'ascend950' },
            ];
            const truncateDescription = (value) => value.length > 140 ? `${value.slice(0, 137)}...` : value;
            const formatValue = (value) => {
              if (typeof value === 'number') {
                return Number.isFinite(value) ? value.toExponential(3) : String(value);
              }
              if (typeof value === 'boolean') {
                return value ? 'true' : 'false';
              }
              return value === undefined || value === null || value === '' ? '-' : String(value);
            };
            const escapeCell = (value) => formatValue(value).replace(/\|/g, '\\|').replace(/[\r\n]+/g, ' ');
            const readJson = (filePath, description, errors) => {
              if (!fs.existsSync(filePath)) {
                errors.push(`${description}未生成`);
                return null;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch (error) {
                errors.push(`${description}无法解析`);
                core.warning(`Unable to parse ${filePath}: ${error.message}`);
                return null;
              }
            };
            const validateIdentity = (metadata, def, description, errors) => {
              if (!metadata || typeof metadata !== 'object') {
                errors.push(`${description}缺少身份信息`);
                return;
              }
              const expected = {
                platform: def.key,
                soc: def.soc,
                head_sha: sha,
                run_id: expectedRunId,
                run_attempt: expectedRunAttempt,
              };
              for (const [key, value] of Object.entries(expected)) {
                if (String(metadata[key] || '') !== String(value)) {
                  errors.push(`${description}${key}不属于本次触发`);
                }
              }
            };
            const validatePlatform = (def) => {
              const errors = [];
              const executionErrors = [];
              const accuracyErrors = [];
              const resultPath = path.join('accuracy-reports', `npu-ci-result-${def.key}.json`);
              const reportPath = path.join('accuracy-reports', `gdr_accuracy_report-${def.key}.json`);
              const execution = readJson(resultPath, '执行结果', executionErrors);
              if (execution) {
                if (execution.schema !== 'npu-ci-platform-result-v1') {
                  executionErrors.push('执行结果 schema 不受支持');
                }
                validateIdentity(execution.metadata, def, '执行结果', executionErrors);
                if (execution.status !== 'success') {
                  executionErrors.push(`执行状态为 ${execution.status || 'unknown'}`);
                }
              }
              const report = readJson(reportPath, '精度报告', accuracyErrors);
              let summary = null;
              if (report) {
                if (report.schema !== 'gdr-accuracy-report-v1') {
                  accuracyErrors.push('精度报告 schema 不受支持');
                }
                validateIdentity(report.metadata, def, '精度报告', accuracyErrors);
                if (!Array.isArray(report.cases)) {
                  accuracyErrors.push('精度报告 cases 无效');
                }
                summary = report.summary;
                if (!summary || typeof summary !== 'object') {
                  accuracyErrors.push('精度报告 summary 无效');
                } else {
                  const fields = ['accuracy_total', 'accuracy_passed', 'accuracy_failed', 'accuracy_not_run'];
                  const values = Object.fromEntries(fields.map((field) => [field, Number(summary[field])]));
                  if (fields.some((field) => !Number.isInteger(values[field]) || values[field] < 0)) {
                    accuracyErrors.push('精度报告计数无效');
                  } else if (values.accuracy_total === 0) {
                    accuracyErrors.push('未发现精度检查用例');
                  } else if (
                    values.accuracy_passed + values.accuracy_failed + values.accuracy_not_run !== values.accuracy_total
                  ) {
                    accuracyErrors.push('精度报告计数不一致');
                  } else if (values.accuracy_failed > 0 || values.accuracy_not_run > 0 || values.accuracy_passed !== values.accuracy_total) {
                    accuracyErrors.push(
                      `精度未通过 (${values.accuracy_passed}/${values.accuracy_total}，失败 ${values.accuracy_failed}，未执行 ${values.accuracy_not_run})`
                    );
                  }
                }
              }
              errors.push(...executionErrors, ...accuracyErrors);
              return {
                ...def,
                execution,
                report,
                summary,
                executionOk: executionErrors.length === 0,
                accuracyOk: accuracyErrors.length === 0,
                executionErrors,
                accuracyErrors,
                errors,
              };
            };

            let currentHeadSha = '';
            let headCheckError = '';
            try {
              const { data: currentPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              currentHeadSha = currentPr.head.sha;
            } catch (error) {
              headCheckError = error.message;
              core.warning(`Unable to inspect current PR head before publishing NPU CI status: ${error.message}`);
            }
            const staleRun = Boolean(currentHeadSha) && currentHeadSha !== sha;
            const platforms = platformDefs.map(validatePlatform);
            const executionOk = !headCheckError && !staleRun && matrixResult === 'success' && platforms.every((item) => item.executionOk);
            const accuracyOk = !headCheckError && !staleRun && platforms.every((item) => item.accuracyOk);
            const invalidReason = headCheckError
              ? '无法确认 PR head，本次 A2+A5 结果失效'
              : (staleRun ? 'PR head 已变化，本次 A2+A5 结果失效' : '');
            const executionDescription = invalidReason || (
              executionOk
                ? `NPU CI 通过 (${mode}+example,A2+A5)`
                : `NPU CI 失败 (${mode}+example,A2+A5)`
            );
            const accuracyTotals = platforms.reduce(
              (totals, item) => {
                if (item.summary) {
                  totals.total += Number(item.summary.accuracy_total || 0);
                  totals.passed += Number(item.summary.accuracy_passed || 0);
                  totals.failed += Number(item.summary.accuracy_failed || 0);
                  totals.notRun += Number(item.summary.accuracy_not_run || 0);
                }
                return totals;
              },
              { total: 0, passed: 0, failed: 0, notRun: 0 }
            );
            const failedPlatformSummary = platforms
              .filter((item) => !item.accuracyOk)
              .map((item) => `${item.label}: ${item.accuracyErrors.join('；') || '精度失败'}`)
              .join('；');
            const accuracyDescription = invalidReason || (accuracyOk
              ? `A2+A5 精度通过：${accuracyTotals.passed}/${accuracyTotals.total} 个用例`
              : truncateDescription(`A2+A5 精度失败：${failedPlatformSummary || '报告不完整'}`));

            await Promise.all([
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: executionOk ? 'success' : 'failure',
                context: 'NPU CI / A2+A5 手动验证',
                description: truncateDescription(executionDescription),
                target_url: targetUrl,
              }),
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: accuracyOk ? 'success' : 'failure',
                context: 'NPU CI / A2+A5 精度检查',
                description: truncateDescription(accuracyDescription),
                target_url: targetUrl,
              }),
            ]);

            const commentBody = [
              `<!-- npu-ci:pr=${prNumber}:sha=${sha} -->`,
              `NPU CI ${executionOk && accuracyOk ? '通过' : '失败'}：\`${sha}\`。`,
              '',
              `- 模式：\`${mode}\``,
              `- 触发人：@${context.actor}`,
              '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
              invalidReason ? `- 失效原因：${invalidReason}` : null,
              `- 执行矩阵：\`${matrixResult}\``,
              '- Example ST：两平台均必跑',
              `- 精度检查：${accuracyDescription}`,
              ops ? `- 算子：\`${ops}\`` : null,
              `- 运行链接：[NPU CI #${context.runNumber}](${targetUrl})`,
              '',
              '### 双平台汇总',
              '',
              '| 平台 | SOC | 执行 | 精度 | 精度用例 | 说明 |',
              '| --- | --- | --- | --- | --- | --- |',
              ...platforms.map((item) => {
                const summary = item.summary || {};
                const accuracyCases = `${summary.accuracy_passed || 0}/${summary.accuracy_total || 0}`;
                return `| ${item.label} | \`${item.soc}\` | ${item.executionOk ? '通过' : '失败'} | ${item.accuracyOk ? '通过' : '失败'} | ${accuracyCases} | ${escapeCell(item.errors.join('；'))} |`;
              }),
            ].filter((line) => line !== null);

            for (const item of platforms) {
              if (!item.report || !Array.isArray(item.report.cases)) {
                continue;
              }
              commentBody.push('', `### ${item.label} 精度详情`, '');
              commentBody.push('| 用例 | Tensor | 结果 | tol | cosine | cos_min | max_abs | mean_abs | rmse | bad_frac | golden |');
              commentBody.push('| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |');
              for (const caseItem of item.report.cases) {
                const metrics = Array.isArray(caseItem.metrics) ? caseItem.metrics : [];
                if (metrics.length === 0) {
                  commentBody.push(
                    `| ${escapeCell(caseItem.name)} | - | ${escapeCell(caseItem.accuracy_status || caseItem.status)} | - | - | - | - | - | - | - | ${escapeCell(caseItem.golden)} |`
                  );
                  continue;
                }
                for (const metric of metrics) {
                  const metricOk = metric.finite === true && metric.allclose === true && metric.cosine_ok === true;
                  commentBody.push(
                    `| ${escapeCell(caseItem.name)} | ${escapeCell(metric.tensor)} | ${metricOk ? '通过' : '失败'} | ` +
                      `${escapeCell(metric.tol)} | ${escapeCell(metric.cosine)} | ${escapeCell(metric.cos_min)} | ` +
                      `${escapeCell(metric.max_abs)} | ${escapeCell(metric.mean_abs)} | ${escapeCell(metric.rmse)} | ` +
                      `${escapeCell(metric.bad_frac)} | ${escapeCell(caseItem.golden)} |`
                  );
                }
              }
            }

            try {
              const body = commentBody.join('\n');
              if (commentId) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: Number(commentId),
                  body,
                });
              } else if (prNumber) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(prNumber),
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to create or update PR comment: ${error.message}`);
            }

            if (!executionOk || !accuracyOk) {
              core.setFailed('A2+A5 NPU CI 汇总未通过。');
            }
