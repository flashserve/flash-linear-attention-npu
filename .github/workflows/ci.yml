name: NPU CI

run-name: 'NPU CI · PR #${{ inputs.pr_number }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to run NPU CI for"
        required: true
      ci_mode:
        description: "CI mode: quick or full"
        required: false
        default: quick
      ops:
        description: "Optional comma-separated operator list for compile diagnostics only"
        required: false
        default: ''
      atk_ops:
        description: "Additional comma-separated ATK operators; use null to skip all ATK validation"
        required: false
        default: ''
      device_id:
        description: "Optional physical NPU ID on each runner; empty selects automatically"
        required: false
        default: ''
      ci_modified:
        description: "Admin approval for changes to ci/ or .github/"
        required: false
        default: 'false'
      requested_by:
        description: "Original authorized requester; set by the PR comment dispatcher"
        required: false
        default: ''

concurrency:
  group: npu-ci-${{ github.repository }}-${{ inputs.pr_number || github.run_id }}
  # Let prepare inspect the preceding result without cancelling its run first.
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 NPU CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      ci_mode: ${{ steps.prepare.outputs.ci_mode }}
      ops: ${{ steps.prepare.outputs.ops }}
      full_build: ${{ steps.prepare.outputs.full_build }}
      build_kind: ${{ steps.prepare.outputs.build_kind }}
      build_ops: ${{ steps.prepare.outputs.build_ops }}
      atk_ops: ${{ steps.prepare.outputs.atk_ops }}
      ci_modified: ${{ steps.prepare.outputs.ci_modified }}
      ci_approval_key: ${{ steps.prepare.outputs.ci_approval_key }}
      device_id: ${{ steps.prepare.outputs.device_id }}
      request_key: ${{ steps.prepare.outputs.request_key }}
    steps:
      - name: 检出 CI 调度脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 解析 PR、权限名单与修改文件
        id: prepare
        uses: actions/github-script@v8
        env:
          NPU_CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          NPU_CI_WORKFLOW_REF: ${{ github.ref_name }}
          NPU_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          NPU_CI_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prepareNpuCi = require(
              `${process.env.GITHUB_WORKSPACE}/ci-control/.github/scripts/prepare_npu_ci.js`
            );
            await prepareNpuCi({ github, context, core });

  ascend-npu:
    name: NPU CI 分项执行 (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      # A2 and A5 jointly form one aggregate gate. Once either platform fails,
      # the sibling job can no longer make the gate pass and should stop early.
      fail-fast: true
      matrix:
        include:
          - platform: a2
            name: A2 / ascend910b
            runner_labels: '["self-hosted","linux","arm64","npu","flash-linear-attention-npu"]'
            soc: ascend910b
            image: fla-npu-ci:9.1.0-910b
            dockerfile: ci/Dockerfile
            require_preloaded_image: 'false'
          - platform: a5
            name: A5 / ascend950
            runner_labels: '["self-hosted","linux","x64","npu","ascend950","flash-linear-attention-npu-a5"]'
            soc: ascend950
            image: fla-npu-ci:9.1.0-950
            dockerfile: ci/Dockerfile.ascend950
            require_preloaded_image: 'true'
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    env:
      CI_MODE: ${{ needs.prepare.outputs.ci_mode }}
      CI_OPS: ${{ needs.prepare.outputs.ops }}
      CI_BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      CI_BUILD_OPS: ${{ needs.prepare.outputs.build_ops }}
      CI_ATK_OPS: ${{ needs.prepare.outputs.atk_ops }}
      CI_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
      CI_DEVICE_ID: ${{ needs.prepare.outputs.device_id }}
      CI_JOBS: '16'
      CI_CPACK_JOBS: '16'
      CI_PROXY_SCRIPT: /home/huangjunzhe/ci/vpn-proxy.sh
      CI_STAGE: ${{ needs.prepare.outputs.ops == '' && 'all' || 'opp-package' }}
      CI_SOC: ${{ matrix.soc }}
      FLA_NPU_SOC: ${{ matrix.soc }}
      CI_RUN_EXAMPLE_ST: 'true'
      CI_ACCURACY_PLATFORM: ${{ matrix.platform }}
      CI_ACCURACY_REPORT_FILE: .ci-tmp/gdr_accuracy_report-${{ matrix.platform }}.json
      CI_STAGE_REPORT_FILE: .ci-tmp/npu-ci-stages-${{ matrix.platform }}.json
      CI_RAW_LOG_FILE: .ci-tmp/npu-ci-${{ matrix.platform }}.log
      CI_DIAGNOSTIC_FILE: .ci-tmp/npu-ci-diagnostics-${{ matrix.platform }}.json
      CI_SUMMARY_FILE: .ci-tmp/npu-ci-summary-${{ matrix.platform }}.md
      CI_ACCURACY_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      CI_ACCURACY_RUN_ID: ${{ github.run_id }}
      CI_ACCURACY_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: ${{ matrix.image }}
      CI_DOCKERFILE: ${{ matrix.dockerfile }}
      CI_REQUIRE_PRELOADED_IMAGE: ${{ matrix.require_preloaded_image }}
      # BiSheng requires a /tmp path inside the container; all backing storage
      # belongs to the runner's writable data directories on the host.
      CI_TMPDIR: /tmp/fla-npu-ci
      CI_HOST_TMPDIR: /home/huangjunzhe/ci/tmp/container-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
      CI_CACHE_ROOT: /home/huangjunzhe/ci/cache_root
      CI_NPU_LOCK_DIR: /home/huangjunzhe/ci/tmp/npu-locks
      CI_TIMING_ROOT: /home/huangjunzhe/ci/results/ci-timings
      TMPDIR: /home/huangjunzhe/ci/tmp
      CI_CONTAINER_NAME: fla-npu-ci-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Re-run failed jobs reuses prepare outputs, so authorize the rerun here too.
      - name: 检出重跑权限校验脚本
        if: github.run_attempt > 1
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: rerun-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 校验 NPU 任务重跑权限
        if: github.run_attempt > 1
        uses: actions/github-script@v8
        env:
          NPU_CI_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          NPU_CI_FILES_MODIFIED: ${{ needs.prepare.outputs.ci_modified }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { requireAuthorizedCiUser, requireCiModificationApproval } = require(
              `${process.env.GITHUB_WORKSPACE}/rerun-policy/.github/scripts/npu_ci_policy.js`
            );
            const username = process.env.NPU_CI_TRIGGERING_ACTOR;
            await requireAuthorizedCiUser({ github, context, username });
            if (process.env.NPU_CI_FILES_MODIFIED === 'true') {
              await requireCiModificationApproval({ github, context, usernames: [username], confirmed: true });
            }

      # Both platforms test the same locally merged base/head commits.
      - name: 拉取当前目标分支代码（直连）
        id: checkout_pr_1
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v5
        env:
          # Ignore inherited runner proxies for the first attempt.
          http_proxy: ''
          https_proxy: ''
          all_proxy: ''
          GIT_HTTP_PROXY: ''
          GIT_HTTPS_PROXY: ''
          no_proxy: '*'
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 50
          path: repo

      - name: 启动目标源码拉取代理
        if: steps.checkout_pr_1.outcome == 'failure'
        run: |
          set -euo pipefail
          source "$CI_PROXY_SCRIPT"
          proxyon
          for variable in http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY \
            no_proxy NO_PROXY GIT_HTTP_PROXY GIT_HTTPS_PROXY PROXY_HTTP_PORT PROXY_SOCKS_PORT PROXY_MIXED_PORT; do
            value="${!variable-}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "[CI][ERROR] Proxy variable $variable contains a newline." >&2
              exit 1
            fi
            printf '%s=%s\n' "$variable" "$value" >> "$GITHUB_ENV"
          done
          rm -rf -- repo

      - name: 拉取当前目标分支代码（代理重试）
        if: steps.checkout_pr_1.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 50
          path: repo

      - name: 拉取并现场合并 PR 代码
        working-directory: repo
        env:
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_head_ref="refs/remotes/pull/${NPU_CI_PR_NUMBER}/head"
          base_ref="refs/remotes/origin/npu-ci-base"

          # Checkout and all later fetches use the same direct-then-proxy policy.
          fetch_with_proxy_fallback() {
            if timeout 180 env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY \
              -u all_proxy -u ALL_PROXY -u GIT_HTTP_PROXY -u GIT_HTTPS_PROXY \
              no_proxy='*' NO_PROXY='*' git -c http.proxy= -c https.proxy= fetch "$@"; then
              return 0
            fi
            echo "[CI] Direct Git fetch failed; retrying through the runner proxy."
            source "$CI_PROXY_SCRIPT" || return $?
            proxyon || return $?
            timeout 600 git fetch "$@"
          }

          fetch_more_history() {
            fetch_with_proxy_fallback --no-tags --prune --no-recurse-submodules "$@" origin \
              "+${NPU_CI_BASE_SHA}:${base_ref}" \
              "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          }

          ensure_merge_base() {
            if git merge-base HEAD "$pr_head_ref" >/dev/null; then
              return 0
            fi
            for deepen_by in 50 100 200 400 800 1600 3200; do
              echo "[CI] Deepening base/PR history by ${deepen_by} commits."
              fetch_more_history --deepen="$deepen_by" || return $?
              if git merge-base HEAD "$pr_head_ref" >/dev/null; then
                return 0
              fi
            done
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              fetch_more_history --unshallow || return $?
            fi
            git merge-base HEAD "$pr_head_ref" >/dev/null
          }

          if [ "$(git rev-parse HEAD)" != "$NPU_CI_BASE_SHA" ]; then
            echo "[CI][ERROR] Checked out base does not match the prepared base SHA." >&2
            exit 1
          fi
          fetch_with_proxy_fallback --no-tags --prune --no-recurse-submodules --depth=50 origin \
            "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          if ! ensure_merge_base; then
            echo "[CI][ERROR] Unable to find a common ancestor for the prepared base and PR head." >&2
            exit 1
          fi
          # Deepening can refresh the PR ref; verify after the last fetch as well.
          fetched_head="$(git rev-parse "$pr_head_ref")"
          if [ "$fetched_head" != "$NPU_CI_TARGET_SHA" ]; then
            echo "[CI][ERROR] PR head changed before merge; target=${NPU_CI_TARGET_SHA}, fetched=${fetched_head}." >&2
            exit 1
          fi
          git merge --no-ff --no-edit "$NPU_CI_TARGET_SHA"

      - name: 运行 ${{ matrix.name }} NPU CI 容器
        id: npu_ci
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_CI_HEAD_POLL_SECONDS: '60'
        run: |
          set -euo pipefail

          # Fetch steps have separate shells. Load the host proxy again for
          # container dependency/base-wheel downloads, even after direct checkout.
          source "$CI_PROXY_SCRIPT"
          proxyon

          mkdir -p "$(dirname "$CI_ACCURACY_REPORT_FILE")" "$(dirname "$CI_RAW_LOG_FILE")"
          rm -f \
            "$CI_ACCURACY_REPORT_FILE" \
            "$CI_ACCURACY_REPORT_FILE.tmp" \
            "$CI_RAW_LOG_FILE" \
            "$CI_DIAGNOSTIC_FILE" \
            "$CI_SUMMARY_FILE"

          get_pr_head_sha() {
            python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["NPU_CI_PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          print(data["head"]["sha"])
          PY
          }

          mark_stale() {
            local current_sha="$1"
            local message="[CI][ERROR] PR head changed while NPU CI was running; target=${NPU_CI_TARGET_SHA}, current=${current_sha}."
            echo "$message" >&2
            echo "$message" >>"$CI_RAW_LOG_FILE"
            {
              echo "NPU_CI_STALE=true"
              echo "NPU_CI_STALE_HEAD=${current_sha}"
            } >>"$GITHUB_ENV"
            docker rm -f "$CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          if current_sha="$(get_pr_head_sha)"; then
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              mark_stale "$current_sha"
              exit 1
            fi
          else
            echo "[CI][WARN] Unable to check PR head before starting NPU CI; continuing."
          fi

          echo "::group::${{ matrix.name }} 完整构建与测试日志（默认折叠）"
          (
            set -o pipefail
            bash ci/run_ci_container.sh 2>&1 | tee "$CI_RAW_LOG_FILE"
          ) &
          ci_pid=$!
          stale=0
          started_at=$SECONDS
          while kill -0 "$ci_pid" >/dev/null 2>&1; do
            sleep "$NPU_CI_HEAD_POLL_SECONDS"
            if ! kill -0 "$ci_pid" >/dev/null 2>&1; then
              break
            fi
            echo "[CI] ${{ matrix.name }} 仍在运行，已耗时 $((SECONDS - started_at)) 秒。"
            if ! current_sha="$(get_pr_head_sha)"; then
              echo "[CI][WARN] Unable to check PR head while NPU CI is running; continuing."
              continue
            fi
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              stale=1
              mark_stale "$current_sha"
              wait "$ci_pid" || true
              break
            fi
          done

          if [[ "$stale" == "1" ]]; then
            ci_status=1
          elif wait "$ci_pid"; then
            ci_status=0
          else
            ci_status=$?
          fi
          echo "::endgroup::"

          summary_status=0
          accuracy_requirement=()
          if [[ -z "$CI_OPS" ]]; then
            accuracy_requirement+=(--require-accuracy-report)
          fi
          python3 ci/summarize_npu_ci.py \
            --log-file "$CI_RAW_LOG_FILE" \
            --accuracy-report-file "$CI_ACCURACY_REPORT_FILE" \
            --stage-report-file "$CI_STAGE_REPORT_FILE" \
            --require-stage-report \
            --platform "$CI_ACCURACY_PLATFORM" \
            --soc "$CI_SOC" \
            --mode "$CI_MODE" \
            --ops "$CI_OPS" \
            --build-kind "$CI_BUILD_KIND" \
            --build-ops "$CI_BUILD_OPS" \
            --atk-ops "$CI_ATK_OPS" \
            --base-ref "$CI_BASE_REF" \
            --device-id "$CI_DEVICE_ID" \
            --exit-code "$ci_status" \
            --head-sha "$CI_ACCURACY_HEAD_SHA" \
            --run-id "$CI_ACCURACY_RUN_ID" \
            --run-attempt "$CI_ACCURACY_RUN_ATTEMPT" \
            --json-out "$CI_DIAGNOSTIC_FILE" \
            --markdown-out "$CI_SUMMARY_FILE" \
            "${accuracy_requirement[@]}" || summary_status=$?

          if [[ -f "$CI_SUMMARY_FILE" ]]; then
            cat "$CI_SUMMARY_FILE"
            cat "$CI_SUMMARY_FILE" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "[CI][ERROR] NPU CI 关键摘要未生成。" >&2
            summary_status=1
          fi

          if [[ "$ci_status" -ne 0 ]]; then
            exit "$ci_status"
          fi
          exit "$summary_status"

      - name: 清理 ${{ matrix.name }} 临时完整日志
        if: always()
        run: |
          set -euo pipefail
          repo_path="$(realpath -m repo)"
          raw_log_path="$(realpath -m "repo/${CI_RAW_LOG_FILE}")"
          case "$raw_log_path" in
            "$repo_path"/*) rm -f "$raw_log_path" ;;
            *) echo "[CI][ERROR] Refusing to clean log outside the repository workspace." >&2; exit 1 ;;
          esac
          expected_host_tmpdir="/home/huangjunzhe/ci/tmp/container-${CI_ACCURACY_PLATFORM}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$CI_HOST_TMPDIR" != "$expected_host_tmpdir" ]]; then
            echo "[CI][ERROR] Refusing to clean an unexpected temporary directory." >&2
            exit 1
          fi
          [[ ! -L "$CI_HOST_TMPDIR" ]] || { echo "[CI][ERROR] Refusing to clean a symlink." >&2; exit 1; }
          rm -rf -- "$CI_HOST_TMPDIR"

      - name: 记录 ${{ matrix.name }} 执行结果
        if: always()
        env:
          NPU_PLATFORM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p repo/.ci-tmp
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["CI_ACCURACY_PLATFORM"]
          result = {
              "schema": "npu-ci-platform-result-v1",
              "metadata": {
                  "platform": platform,
                  "soc": os.environ["CI_SOC"],
                  "head_sha": os.environ["CI_ACCURACY_HEAD_SHA"],
                  "run_id": os.environ["CI_ACCURACY_RUN_ID"],
                  "run_attempt": os.environ["CI_ACCURACY_RUN_ATTEMPT"],
              },
              "status": os.environ["NPU_PLATFORM_JOB_STATUS"],
          }
          path = Path("repo/.ci-tmp") / f"npu-ci-result-{platform}.json"
          tmp_path = path.with_suffix(path.suffix + ".tmp")
          tmp_path.write_text(json.dumps(result, indent=2), encoding="utf-8")
          tmp_path.replace(path)
          PY

      - name: 上传 ${{ matrix.name }} 结果
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npu-ci-result-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repo/.ci-tmp/npu-ci-result-${{ matrix.platform }}.json
            repo/${{ env.CI_ACCURACY_REPORT_FILE }}
            repo/${{ env.CI_STAGE_REPORT_FILE }}
            repo/${{ env.CI_DIAGNOSTIC_FILE }}
            repo/${{ env.CI_SUMMARY_FILE }}
            repo/.ci-tmp/atk-results/
            repo/.ci-tmp/npu-ci-package.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  finalize:
    name: 校验并发布 A2 + A5 分项状态
    needs: [prepare, ascend-npu]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: 检出 PR 状态发布脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          path: pr-ci
          sparse-checkout: .github/scripts/publish_npu_ci_status.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 下载双平台结果
        id: download_results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: npu-ci-result-*-${{ github.run_id }}-*
          path: accuracy-reports
          merge-multiple: false

      - name: 发布双平台 NPU CI 状态
        id: publish_statuses
        if: always()
        uses: actions/github-script@v8
        env:
          NPU_CI_MODE: ${{ needs.prepare.outputs.ci_mode }}
          NPU_OPS: ${{ needs.prepare.outputs.ops }}
          NPU_ATK_OPS: ${{ needs.prepare.outputs.atk_ops }}
          NPU_CI_BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
          NPU_CI_APPROVAL_KEY: ${{ needs.prepare.outputs.ci_approval_key }}
          NPU_CI_BUILD_OPS: ${{ needs.prepare.outputs.build_ops }}
          NPU_CI_DEVICE_ID: ${{ needs.prepare.outputs.device_id }}
          NPU_CI_REQUEST_KEY: ${{ needs.prepare.outputs.request_key }}
          NPU_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_MATRIX_RESULT: ${{ needs.ascend-npu.result }}
          NPU_EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_EXPECTED_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          NPU_EXPECTED_RUN_ID: ${{ github.run_id }}
          NPU_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publishNpuCiStatus = require(
              `${process.env.GITHUB_WORKSPACE}/pr-ci/.github/scripts/publish_npu_ci_status.js`
            );
            await publishNpuCiStatus({ github, context, core });

      - name: 状态发布异常时收敛全部分项
        if: always() && steps.publish_statuses.outputs.statuses_published != 'true'
        uses: actions/github-script@v8
        env:
          NPU_EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_OPS: ${{ needs.prepare.outputs.ops }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.NPU_EXPECTED_HEAD_SHA;
            const contexts = [
              'NPU CI / A2+A5 / 01 环境、wheel 与运行时契约',
              'NPU CI / A2+A5 / 02 全量 OPP 构建',
              'NPU CI / A2+A5 / 03 torch_custom wheel 与 OPP 布局',
              'NPU CI / A2+A5 / 04 OPP 安装与 PyTorch 适配',
