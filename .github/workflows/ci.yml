name: NPU CI

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to run NPU CI for"
        required: true
      ci_mode:
        description: "CI mode: quick or full"
        required: false
        default: quick
      ops:
        description: "Optional comma-separated operator list"
        required: false
        default: ''

concurrency:
  group: npu-ci-${{ github.repository }}-${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number) || (contains(github.event.comment.body, '/run-npu-ci') && github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 NPU CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.actor != 'github-actions[bot]' &&
        contains(github.event.comment.body, '/run-npu-ci')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      head_repo: ${{ steps.prepare.outputs.head_repo }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      trusted_ci_sha: ${{ steps.prepare.outputs.trusted_ci_sha }}
      ci_mode: ${{ steps.prepare.outputs.ci_mode }}
      ops: ${{ steps.prepare.outputs.ops }}
      comment_id: ${{ steps.prepare.outputs.comment_id }}
    steps:
      - name: 解析 PR 和 CI 参数
        id: prepare
        uses: actions/github-script@v7
        env:
          NPU_CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const actor = context.actor;
            let actorPermission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              actorPermission = data.permission || 'none';
            } catch (error) {
              core.warning(`Unable to inspect repository permission for ${actor}: ${error.message}`);
            }
            if (actorPermission !== 'admin') {
              core.setFailed(`${actor} 无权触发 NPU CI：需要仓库 Admin 权限，当前权限为 ${actorPermission}。`);
              return;
            }

            const contextName = 'NPU CI / A2+A5 手动验证';
            const accuracyContextName = 'NPU CI / A2+A5 精度检查';
            const platformContract = 'A2+A5';
            let prNumber;
            let ciMode = 'quick';
            let ops = '';
            let commentId = '';
            const upsertComment = async (pr, body) => {
              if (!prNumber || !pr) {
                return '';
              }
              const marker = `<!-- npu-ci:pr=${prNumber}:sha=${pr.head.sha} -->`;
              const fullBody = `${marker}\n${body}`;
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                const existing = comments
                  .filter((comment) =>
                    comment.user &&
                    comment.user.type === 'Bot' &&
                    typeof comment.body === 'string' &&
                    comment.body.includes(marker)
                  )
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: fullBody,
                  });
                  return String(existing.id);
                }

                const { data: comment } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: fullBody,
                });
                return String(comment.id);
              } catch (error) {
                core.warning(`Unable to create or update PR comment: ${error.message}`);
                return '';
              }
            };

            const isActivePendingStatus = async (status) => {
              if (!status || status.state !== 'pending') {
                return false;
              }
              const description = status.description || '';
              if (!description.includes('+example') || !description.includes(platformContract)) {
                return false;
              }
              const targetUrl = status.target_url || '';
              const match = targetUrl.match(/\/actions\/runs\/(\d+)/);
              if (!match) {
                core.warning('NPU CI pending status has no Actions run URL; treating it as active.');
                return true;
              }
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(match[1]),
                });
                return ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status);
              } catch (error) {
                core.warning(`Unable to inspect NPU CI workflow run: ${error.message}`);
                return true;
              }
            };

            if (context.eventName === 'workflow_dispatch') {
              const workflowInputs = context.payload.inputs || {};
              prNumber = Number(workflowInputs.pr_number);
              ciMode = workflowInputs.ci_mode || 'quick';
              ops = workflowInputs.ops || '';
            } else {
              prNumber = context.payload.issue.number;
              const body = (context.payload.comment.body || '').trim();
              if (!body.startsWith('/run-npu-ci')) {
                core.notice('评论包含 /run-npu-ci，但去掉首尾空白后不是以触发命令开头，跳过。');
                core.setOutput('should_run', 'false');
                return;
              }
              const parts = body.split(/\s+/).slice(1);
              for (const part of parts) {
                if (part === 'quick' || part === 'full') {
                  ciMode = part;
                } else if (part.startsWith('ops=')) {
                  ops = part.slice('ops='.length);
                }
              }
            }

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`无效的 PR 编号：${prNumber}`);
              return;
            }
            if (!['quick', 'full'].includes(ciMode)) {
              core.setFailed(`不支持的 CI 模式：${ciMode}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} 仍是草稿，请先标记为 ready for review 后再运行 NPU CI。`);
              return;
            }
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: pr.base.ref,
            });
            const baseSha = baseBranch.commit.sha;
            const workflowSha = process.env.NPU_CI_WORKFLOW_SHA || '';
            const trustedCiSha = context.eventName === 'workflow_dispatch' ? workflowSha : baseSha;
            if (!/^[0-9a-f]{40}$/.test(baseSha) || !/^[0-9a-f]{40}$/.test(trustedCiSha)) {
              core.setFailed('无法确定本次 NPU CI 的 base 或可信 CI commit。');
              return;
            }
            core.setOutput('base_sha', baseSha);
            core.setOutput('trusted_ci_sha', trustedCiSha);

            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const manualCiStatuses = statuses
              .filter((status) => status.context === contextName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latestExecutionCi = manualCiStatuses
              .find((status) => {
                const description = status.description || '';
                return description.includes('+example') && description.includes(platformContract);
              });
            const accuracyStatuses = statuses
              .filter((status) => status.context === accuracyContextName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latestAccuracyCi = accuracyStatuses
              .find((status) => (status.description || '').includes(platformContract));
            const latestPassedWithExample = latestExecutionCi &&
              latestExecutionCi.state === 'success' &&
              latestAccuracyCi &&
              latestAccuracyCi.state === 'success' &&
              latestExecutionCi.target_url &&
              latestExecutionCi.target_url === latestAccuracyCi.target_url;
            if (latestPassedWithExample) {
              core.notice(`${pr.head.sha} 已经通过 NPU CI 和精度检查，跳过重复运行。`);
              commentId = await upsertComment(
                pr,
                [
                  `NPU CI 和精度检查已经在 \`${pr.head.sha}\` 上通过，本次不会重复运行。`,
                  '',
                  `- 请求模式：\`${ciMode}\``,
                  `- 触发人：@${actor}`,
                  '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                  '- Example ST：已覆盖',
                  '- 精度检查：已覆盖',
                  '- Example ST 用例：全部 enabled 用例',
                ].join('\n')
              );
              core.setOutput('should_run', 'false');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('head_repo', pr.head.repo.full_name);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('ci_mode', ciMode);
              core.setOutput('ops', ops);
              core.setOutput('comment_id', commentId);
              return;
            }
            if (await isActivePendingStatus(latestExecutionCi)) {
              core.notice(`${pr.head.sha} 已经有 NPU CI 在排队或运行，跳过重复启动。`);
              commentId = await upsertComment(
                pr,
                [
                  `NPU CI 已在验证 \`${pr.head.sha}\`，本次评论不会重复启动新任务。`,
                  '',
                  `- 请求模式：\`${ciMode}\``,
                  `- 触发人：@${actor}`,
                  '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                  '- 当前状态：排队或运行中',
                  '- Example ST：必跑',
                  '- Example ST 用例：全部 enabled 用例',
                  latestExecutionCi.target_url ? `- 运行链接：[查看已有 NPU CI](${latestExecutionCi.target_url})` : '',
                ].filter(Boolean).join('\n')
              );
              core.setOutput('should_run', 'false');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('head_repo', pr.head.repo.full_name);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('ci_mode', ciMode);
              core.setOutput('ops', ops);
              core.setOutput('comment_id', commentId);
              return;
            }

            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await Promise.all([
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'pending',
                context: contextName,
                description: `NPU CI 已由 @${actor} 触发 (${ciMode}+example,${platformContract})`,
                target_url: targetUrl,
              }),
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'pending',
                context: accuracyContextName,
                description: `${platformContract} 精度检查等待执行`,
                target_url: targetUrl,
              }),
            ]);
            commentId = await upsertComment(
              pr,
              [
                `NPU CI 已开始验证 \`${pr.head.sha}\`。`,
                '',
                `- 模式：\`${ciMode}\``,
                `- 触发人：@${actor}`,
                '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
                '- Example ST：必跑',
                '- Example ST 用例：全部 enabled 用例',
                ops ? `- 算子：\`${ops}\`` : '',
                `- 运行链接：[NPU CI #${context.runNumber}](${targetUrl})`,
              ].filter(Boolean).join('\n')
            );

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('ci_mode', ciMode);
            core.setOutput('ops', ops);
            core.setOutput('comment_id', commentId);

  ascend-npu:
    name: Ascend NPU 验证 (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: a2
            name: A2 / ascend910b
            runner_labels: '["self-hosted","linux","arm64","npu","flash-linear-attention-npu"]'
            soc: ascend910b
            image: fla-npu-ci:9.1.0-910b
            dockerfile: ci/Dockerfile
            require_preloaded_image: 'false'
            tmpdir: ''
          - platform: a5
            name: A5 / ascend950
            runner_labels: '["self-hosted","linux","x64","npu","ascend950","flash-linear-attention-npu-a5"]'
            soc: ascend950
            image: fla-npu-ci:9.1.0-950
            dockerfile: ci/Dockerfile.ascend950
            require_preloaded_image: 'true'
            tmpdir: /tmp/fla-npu-ci
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    env:
      CI_MODE: ${{ needs.prepare.outputs.ci_mode }}
      CI_OPS: ${{ needs.prepare.outputs.ops }}
      CI_SOC: ${{ matrix.soc }}
      FLA_NPU_SOC: ${{ matrix.soc }}
      CI_RUN_EXAMPLE_ST: 'true'
      CI_RUN_STANDALONE_WHEEL_LAYOUT_CHECK: 'true'
      CI_RUN_SCOPED_WHEEL_INSTALL_CHECK: 'true'
      CI_ACCURACY_PLATFORM: ${{ matrix.platform }}
      CI_ACCURACY_REPORT_FILE: .ci-tmp/gdr_accuracy_report-${{ matrix.platform }}.json
      CI_RAW_LOG_FILE: .ci-tmp/npu-ci-${{ matrix.platform }}.log
      CI_DIAGNOSTIC_FILE: .ci-tmp/npu-ci-diagnostics-${{ matrix.platform }}.json
      CI_SUMMARY_FILE: .ci-tmp/npu-ci-summary-${{ matrix.platform }}.md
      CI_ACCURACY_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      CI_ACCURACY_RUN_ID: ${{ github.run_id }}
      CI_ACCURACY_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: ${{ matrix.image }}
      CI_DOCKERFILE: ${{ matrix.dockerfile }}
      CI_REQUIRE_PRELOADED_IMAGE: ${{ matrix.require_preloaded_image }}
      CI_TMPDIR: ${{ matrix.tmpdir }}
    steps:
      - name: 通过 GitHub API 准备 A5 源码
        if: matrix.platform == 'a5'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          NPU_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_CI_TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_ci_sha }}
        run: |
          set -euo pipefail

          archive_dir="${RUNNER_TEMP}/fla-npu-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf repo trusted-ci "$archive_dir"
          mkdir -p repo trusted-ci "$archive_dir"
          export NPU_CI_ARCHIVE_DIR="$archive_dir"

          python3 - <<'PY'
          import json
          import os
          import shutil
          import stat
          import tarfile
          import time
          import urllib.request
          from pathlib import Path, PurePosixPath

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = os.environ["NPU_CI_PR_NUMBER"]
          expected_base_ref = os.environ["NPU_CI_BASE_REF"]
          expected_base_sha = os.environ["NPU_CI_BASE_SHA"]
          expected_head_sha = os.environ["NPU_CI_TARGET_SHA"]
          trusted_sha = os.environ["NPU_CI_TRUSTED_SHA"]
          archive_dir = Path(os.environ["NPU_CI_ARCHIVE_DIR"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/{path}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          merge_sha = ""
          base_sha = expected_base_sha
          last_error = "GitHub has not produced a current test merge commit"
          for attempt in range(12):
              pr = get_json(f"pulls/{pr_number}")
              head_sha = pr["head"]["sha"]
              base_ref = pr["base"]["ref"]
              if head_sha != expected_head_sha:
                  raise RuntimeError(
                      f"PR head changed before archive download: expected={expected_head_sha}, actual={head_sha}"
                  )
              if base_ref != expected_base_ref:
                  raise RuntimeError(
                      f"PR base changed before archive download: expected={expected_base_ref}, actual={base_ref}"
                  )
              merge_sha = pr.get("merge_commit_sha") or ""
              if merge_sha:
                  merge_commit = get_json(f"commits/{merge_sha}")
                  parents = [parent["sha"] for parent in merge_commit.get("parents", [])]
                  if parents == [base_sha, head_sha]:
                      break
                  last_error = (
                      "test merge parents do not match the current base and head: "
                      f"merge={merge_sha}, parents={parents}"
                  )
              if attempt < 11:
                  time.sleep(5)
          else:
              raise RuntimeError(last_error)

          def download_archive(sha, destination):
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/tarball/{sha}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  with destination.open("wb") as output:
                      shutil.copyfileobj(response, output)

          def extract_archive(archive_path, destination):
              if not stat.S_ISDIR(destination.lstat().st_mode):
                  raise RuntimeError(f"archive destination is not a directory: {destination}")
              if any(destination.iterdir()):
                  raise RuntimeError(f"archive destination is not empty: {destination}")

              checked_members = []
              seen_paths = set()
              root_name = None
              root_entry_seen = False
              with tarfile.open(archive_path, "r:gz") as archive:
                  for member in archive.getmembers():
                      member_path = PurePosixPath(member.name)
                      parts = member_path.parts
                      if (
                          not parts
                          or member_path.is_absolute()
                          or any(part in {"", ".."} for part in parts)
                      ):
                          raise RuntimeError(f"unsafe archive member path: {member.name!r}")

                      if root_name is None:
                          root_name = parts[0]
                      elif parts[0] != root_name:
                          raise RuntimeError("archive contains multiple top-level directories")

                      if len(parts) == 1:
                          if not member.isdir():
                              raise RuntimeError("archive top-level member is not a directory")
                          if root_entry_seen:
                              raise RuntimeError("duplicate archive top-level directory")
                          root_entry_seen = True
                          continue

                      relative_parts = parts[1:]
                      if relative_parts in seen_paths:
                          raise RuntimeError(f"duplicate archive member: {member.name!r}")
                      seen_paths.add(relative_parts)
                      if not (member.isdir() or member.isfile()):
                          raise RuntimeError(
                              f"unsupported archive member type: {member.name!r}"
                          )
                      checked_members.append((member, relative_parts))

                  if root_name is None:
                      raise RuntimeError("archive is empty")

                  directory_modes = []
                  nofollow = getattr(os, "O_NOFOLLOW", 0)
                  if not nofollow:
                      raise RuntimeError("O_NOFOLLOW is required for safe archive extraction")
                  for member, relative_parts in checked_members:
                      target = destination.joinpath(*relative_parts)
                      if member.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                          directory_modes.append((target, member.mode & 0o777))
                          continue

                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = archive.extractfile(member)
                      if source is None:
                          raise RuntimeError(f"cannot read archive member: {member.name!r}")
                      flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | nofollow
                      output_fd = os.open(target, flags, member.mode & 0o777)
                      with source, os.fdopen(output_fd, "wb") as output:
                          shutil.copyfileobj(source, output)
                      os.chmod(target, member.mode & 0o777)

                  for target, mode in reversed(directory_modes):
                      os.chmod(target, mode)

          def copy_case_file(repo_directory, destination):
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              directory = getattr(os, "O_DIRECTORY", 0)
              if not nofollow or not directory:
                  raise RuntimeError("O_NOFOLLOW and O_DIRECTORY are required")

              repo_fd = os.open(
                  repo_directory, os.O_RDONLY | directory | nofollow
              )
              try:
                  try:
                      ci_fd = os.open(
                          "ci", os.O_RDONLY | directory | nofollow, dir_fd=repo_fd
                      )
                  except FileNotFoundError:
                      return False
                  try:
                      try:
                          case_fd = os.open(
                              "example_st_cases.json",
                              os.O_RDONLY | os.O_NONBLOCK | nofollow,
                              dir_fd=ci_fd,
                          )
                      except FileNotFoundError:
                          return False
                      with os.fdopen(case_fd, "rb") as case_file:
                          if not stat.S_ISREG(os.fstat(case_file.fileno()).st_mode):
                              raise RuntimeError("Example/ST case path is not a regular file")
                          case_data = case_file.read()
                  finally:
                      os.close(ci_fd)
              finally:
                  os.close(repo_fd)

              json.loads(case_data.decode("utf-8"))
              parent_fd = os.open(
                  destination.parent, os.O_RDONLY | directory | nofollow
              )
              try:
                  output_fd = os.open(
                      destination.name,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | nofollow,
                      0o600,
                      dir_fd=parent_fd,
                  )
                  with os.fdopen(output_fd, "wb") as output:
                      output.write(case_data)
              finally:
                  os.close(parent_fd)
              return True

          download_archive(merge_sha, archive_dir / "merge.tar.gz")
          download_archive(trusted_sha, archive_dir / "trusted.tar.gz")
          extract_archive(archive_dir / "merge.tar.gz", Path("repo"))
          extract_archive(archive_dir / "trusted.tar.gz", Path("trusted-ci"))
          copy_case_file(
              Path("repo"), archive_dir / "example_st_cases.json"
          )
          print(
              "Validated A5 source archive: "
              f"merge={merge_sha}, base={base_sha}, head={expected_head_sha}, trusted={trusted_sha}"
          )
          PY

          rm -rf repo/ci
          cp -a trusted-ci/ci repo/ci
          if [ -f "$archive_dir/example_st_cases.json" ]; then
            cp "$archive_dir/example_st_cases.json" repo/ci/example_st_cases.json
          fi
          rm -rf trusted-ci "$archive_dir"

      - name: 拉取当前目标分支代码（第 1 次）
        id: checkout_pr_1
        if: matrix.platform == 'a2'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 50
          path: repo

      - name: 启动代理并获取端口
        if: steps.checkout_pr_1.outcome == 'failure' && matrix.platform == 'a2'
        run: |
          # 1. 备份现有环境变量
          echo "========== 备份原有代理配置 =========="
          
          # 备份环境变量
          if [ -n "$http_proxy" ]; then
            export OLD_http_proxy="$http_proxy"
            echo "OLD_http_proxy=$http_proxy" >> $GITHUB_ENV
            echo "备份 http_proxy: $http_proxy"
          fi
          
          if [ -n "$https_proxy" ]; then
            export OLD_https_proxy="$https_proxy"
            echo "OLD_https_proxy=$https_proxy" >> $GITHUB_ENV
            echo "备份 https_proxy: $https_proxy"
          fi
          
          if [ -n "$HTTP_PROXY" ]; then
            export OLD_HTTP_PROXY="$HTTP_PROXY"
            echo "OLD_HTTP_PROXY=$HTTP_PROXY" >> $GITHUB_ENV
            echo "备份 HTTP_PROXY: $HTTP_PROXY"
          fi
          
          if [ -n "$HTTPS_PROXY" ]; then
            export OLD_HTTPS_PROXY="$HTTPS_PROXY"
            echo "OLD_HTTPS_PROXY=$HTTPS_PROXY" >> $GITHUB_ENV
            echo "备份 HTTPS_PROXY: $HTTPS_PROXY"
          fi
          
          if [ -n "$all_proxy" ]; then
            export OLD_all_proxy="$all_proxy"
            echo "OLD_all_proxy=$all_proxy" >> $GITHUB_ENV
            echo "备份 all_proxy: $all_proxy"
          fi
          
          # 备份 Git 代理配置
          echo "========== 备份 Git 代理配置 =========="
          OLD_GIT_HTTP_PROXY=$(git config --global --get http.proxy || echo "")
          OLD_GIT_HTTPS_PROXY=$(git config --global --get https.proxy || echo "")
          
          if [ -n "$OLD_GIT_HTTP_PROXY" ]; then
            echo "OLD_GIT_HTTP_PROXY=$OLD_GIT_HTTP_PROXY" >> $GITHUB_ENV
            echo "备份 git http.proxy: $OLD_GIT_HTTP_PROXY"
          fi
          
          if [ -n "$OLD_GIT_HTTPS_PROXY" ]; then
            echo "OLD_GIT_HTTPS_PROXY=$OLD_GIT_HTTPS_PROXY" >> $GITHUB_ENV
            echo "备份 git https.proxy: $OLD_GIT_HTTPS_PROXY"
          fi
          
          # 2. 启动新代理
          echo "========== 启动新代理 =========="
          # 加载代理配置
          source /etc/profile.d/vpn-proxy.sh
          proxyon
          
          # 从环境变量获取实际端口
          HTTP_PORT=$(echo $http_proxy | sed 's/http:\/\/127.0.0.1://' || echo "7899")
          SOCKS_PORT=$(echo $all_proxy | sed 's/socks5h:\/\/127.0.0.1://' || echo "7891")
          
          # 如果环境变量未设置，从 runtime.yaml 读取
          if [ -z "$HTTP_PORT" ]; then
            HTTP_PORT=$(grep -A5 'proxies:' /root/clashctl/resources/runtime.yaml | grep -m1 'port:' | awk '{print $2}' || echo "7899")
          fi
          
          # 保存到 GITHUB_ENV，供后续步骤使用
          echo "PROXY_HTTP_PORT=$HTTP_PORT" >> $GITHUB_ENV
          echo "PROXY_SOCKS_PORT=$SOCKS_PORT" >> $GITHUB_ENV
          echo "http_proxy=http://127.0.0.1:$HTTP_PORT" >> $GITHUB_ENV
          echo "https_proxy=http://127.0.0.1:$HTTP_PORT" >> $GITHUB_ENV
          echo "all_proxy=socks5h://127.0.0.1:$SOCKS_PORT" >> $GITHUB_ENV
          
          echo "检测到代理端口: HTTP=$HTTP_PORT, SOCKS=$SOCKS_PORT"
          export HOME=${HOME:-/workspace/ci/}
          echo "HOME=$HOME" >> $GITHUB_ENV
          # 配置 Git 代理
          git config --global http.proxy http://127.0.0.1:$HTTP_PORT
          git config --global https.proxy http://127.0.0.1:$HTTP_PORT
          git config --global http.postBuffer 524288000

      - name: 等待后重试拉取目标分支代码
        if: matrix.platform == 'a2' && steps.checkout_pr_1.outcome == 'failure'
        run: |
          rm -rf repo
          sleep 15

      - name: 拉取当前目标分支代码（第 2 次）
        id: checkout_pr_2
        if: matrix.platform == 'a2' && steps.checkout_pr_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 50
          path: repo

      - name: 再次等待后重试拉取目标分支代码
        if: matrix.platform == 'a2' && steps.checkout_pr_1.outcome == 'failure' && steps.checkout_pr_2.outcome == 'failure'
        run: |
          rm -rf repo
          sleep 30

      - name: 拉取当前目标分支代码（第 3 次）
        if: matrix.platform == 'a2' && steps.checkout_pr_1.outcome == 'failure' && steps.checkout_pr_2.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 50
          path: repo

      - name: 现场合并 PR 代码
        if: matrix.platform == 'a2'
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_head_ref="refs/remotes/pull/${NPU_CI_PR_NUMBER}/head"

          retry_fetch_pr_head() {
            local delay="$1"
            if [ "$delay" != "0" ]; then
              sleep "$delay"
            fi
            git fetch --no-tags --prune --no-recurse-submodules --depth=50 origin \
              "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          }

          fetch_more_history() {
            local deepen_by="$1"
            echo "[CI] Merge base not found in shallow history; deepening by ${deepen_by} commits."
            git fetch --no-tags --prune --no-recurse-submodules --deepen="${deepen_by}" origin \
              "+refs/heads/${NPU_CI_BASE_REF}:refs/remotes/origin/${NPU_CI_BASE_REF}" \
              "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
          }

          ensure_merge_base() {
            if git merge-base HEAD "${pr_head_ref}" >/dev/null; then
              return 0
            fi
            for deepen_by in 50 100 200 400 800 1600 3200; do
              fetch_more_history "${deepen_by}"
              if git merge-base HEAD "${pr_head_ref}" >/dev/null; then
                return 0
              fi
            done
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "[CI] Merge base still not found; unshallowing repository as final probe."
              git fetch --no-tags --prune --no-recurse-submodules --unshallow origin \
                "+refs/heads/${NPU_CI_BASE_REF}:refs/remotes/origin/${NPU_CI_BASE_REF}" \
                "+refs/pull/${NPU_CI_PR_NUMBER}/head:${pr_head_ref}"
            fi
            git merge-base HEAD "${pr_head_ref}" >/dev/null
          }

          retry_fetch_pr_head 0 || retry_fetch_pr_head 15 || retry_fetch_pr_head 30
          fetched_head="$(git rev-parse "${pr_head_ref}")"
          if [ "$fetched_head" != "$NPU_CI_TARGET_SHA" ]; then
            echo "[CI][ERROR] PR head changed before merge; target=${NPU_CI_TARGET_SHA}, fetched=${fetched_head}."
            exit 1
          fi
          if ! ensure_merge_base; then
            echo "[CI][ERROR] Unable to find merge base between current base ${NPU_CI_BASE_REF} and PR head after probing history."
            exit 1
          fi

          git merge --no-ff --no-edit "${pr_head_ref}"
        env:
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}

      - name: 拉取可信 CI 脚本（第 1 次）
        id: checkout_trusted_ci_1
        if: matrix.platform == 'a2'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_ci_sha }}
          fetch-depth: 1
          path: trusted-ci

      - name: 等待后重试拉取可信 CI 脚本
        if: matrix.platform == 'a2' && steps.checkout_trusted_ci_1.outcome == 'failure'
        run: |
          rm -rf trusted-ci
          sleep 15

      - name: 拉取可信 CI 脚本（第 2 次）
        id: checkout_trusted_ci_2
        if: matrix.platform == 'a2' && steps.checkout_trusted_ci_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_ci_sha }}
          fetch-depth: 1
          path: trusted-ci

      - name: 再次等待后重试拉取可信 CI 脚本
        if: matrix.platform == 'a2' && steps.checkout_trusted_ci_1.outcome == 'failure' && steps.checkout_trusted_ci_2.outcome == 'failure'
        run: |
          rm -rf trusted-ci
          sleep 30

      - name: 拉取可信 CI 脚本（第 3 次）
        if: matrix.platform == 'a2' && steps.checkout_trusted_ci_1.outcome == 'failure' && steps.checkout_trusted_ci_2.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_ci_sha }}
          fetch-depth: 1
          path: trusted-ci

      - name: 使用可信 CI 脚本
        if: matrix.platform == 'a2'
        run: |
          # issue_comment 使用 prepare 固定的 PR base commit；workflow_dispatch 仅允许仓库
          # Admin 触发，并使用定义当前 job 的 workflow commit。两种路径都通过不可变 SHA
          # 选择可信 CI，同时允许 CI 自身修改在合入前验证。
          # 但 Example/ST 用例配置属于被验证内容：新 PR 中新增或修改的 enabled 用例
          # 必须跟随当前目标分支和 PR head 的现场合并结果一起进入容器，并被 /run-npu-ci quick 实际执行验证。
          case_archive="$(mktemp -d "${RUNNER_TEMP}/example-st-cases.XXXXXX")"
          export NPU_CI_CASE_ARCHIVE="$case_archive"
          python3 - <<'PY'
          import json
          import os
          import stat
          from pathlib import Path

          def copy_case_file(repo_directory, destination):
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              directory = getattr(os, "O_DIRECTORY", 0)
              if not nofollow or not directory:
                  raise RuntimeError("O_NOFOLLOW and O_DIRECTORY are required")

              repo_fd = os.open(
                  repo_directory, os.O_RDONLY | directory | nofollow
              )
              try:
                  try:
                      ci_fd = os.open(
                          "ci", os.O_RDONLY | directory | nofollow, dir_fd=repo_fd
                      )
                  except FileNotFoundError:
                      return False
                  try:
                      try:
                          case_fd = os.open(
                              "example_st_cases.json",
                              os.O_RDONLY | os.O_NONBLOCK | nofollow,
                              dir_fd=ci_fd,
                          )
                      except FileNotFoundError:
                          return False
                      with os.fdopen(case_fd, "rb") as case_file:
                          if not stat.S_ISREG(os.fstat(case_file.fileno()).st_mode):
                              raise RuntimeError("Example/ST case path is not a regular file")
                          case_data = case_file.read()
                  finally:
                      os.close(ci_fd)
              finally:
                  os.close(repo_fd)

              json.loads(case_data.decode("utf-8"))
              parent_fd = os.open(
                  destination.parent, os.O_RDONLY | directory | nofollow
              )
              try:
                  output_fd = os.open(
                      destination.name,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | nofollow,
                      0o600,
                      dir_fd=parent_fd,
                  )
                  with os.fdopen(output_fd, "wb") as output:
                      output.write(case_data)
              finally:
                  os.close(parent_fd)
              return True

          copy_case_file(
              Path("repo"),
              Path(os.environ["NPU_CI_CASE_ARCHIVE"])
              / "example_st_cases.json",
          )
          PY

          rm -rf repo/ci
          cp -a trusted-ci/ci repo/ci

          # 覆盖可信 CI 脚本后，再恢复 PR 自身的 case 文件。
          # 因此后续 PR 只补充 ci/example_st_cases.json 时，NPU CI 会跑到新增用例。
          if [ -f "$case_archive/example_st_cases.json" ]; then
            cp "$case_archive/example_st_cases.json" repo/ci/example_st_cases.json
          fi
          rm -rf "$case_archive"

      - name: 运行 ${{ matrix.name }} NPU CI 容器
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPU_CI_PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          NPU_CI_TARGET_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_CI_HEAD_POLL_SECONDS: '60'
          CI_CONTAINER_NAME: fla-npu-ci-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$CI_ACCURACY_REPORT_FILE")" "$(dirname "$CI_RAW_LOG_FILE")"
          rm -f \
            "$CI_ACCURACY_REPORT_FILE" \
            "$CI_ACCURACY_REPORT_FILE.tmp" \
            "$CI_RAW_LOG_FILE" \
            "$CI_DIAGNOSTIC_FILE" \
            "$CI_SUMMARY_FILE"

          get_pr_head_sha() {
            python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["NPU_CI_PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          print(data["head"]["sha"])
          PY
          }

          mark_stale() {
            local current_sha="$1"
            local message="[CI][ERROR] PR head changed while NPU CI was running; target=${NPU_CI_TARGET_SHA}, current=${current_sha}."
            echo "$message" >&2
            echo "$message" >>"$CI_RAW_LOG_FILE"
            {
              echo "NPU_CI_STALE=true"
              echo "NPU_CI_STALE_HEAD=${current_sha}"
            } >>"$GITHUB_ENV"
            docker rm -f "$CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          if current_sha="$(get_pr_head_sha)"; then
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              mark_stale "$current_sha"
              exit 1
            fi
          else
            echo "[CI][WARN] Unable to check PR head before starting NPU CI; continuing."
          fi

          echo "::group::${{ matrix.name }} 完整构建与测试日志（默认折叠）"
          (
            set -o pipefail
            bash ci/run_ci_container.sh 2>&1 | tee "$CI_RAW_LOG_FILE"
          ) &
          ci_pid=$!
          stale=0
          started_at=$SECONDS
          while kill -0 "$ci_pid" >/dev/null 2>&1; do
            sleep "$NPU_CI_HEAD_POLL_SECONDS"
            if ! kill -0 "$ci_pid" >/dev/null 2>&1; then
              break
            fi
            echo "[CI] ${{ matrix.name }} 仍在运行，已耗时 $((SECONDS - started_at)) 秒。"
            if ! current_sha="$(get_pr_head_sha)"; then
              echo "[CI][WARN] Unable to check PR head while NPU CI is running; continuing."
              continue
            fi
            if [[ "$current_sha" != "$NPU_CI_TARGET_SHA" ]]; then
              stale=1
              mark_stale "$current_sha"
              wait "$ci_pid" || true
              break
            fi
          done

          if [[ "$stale" == "1" ]]; then
            ci_status=1
          elif wait "$ci_pid"; then
            ci_status=0
          else
            ci_status=$?
          fi
          echo "::endgroup::"

          summary_status=0
          python3 ci/summarize_npu_ci.py \
            --log-file "$CI_RAW_LOG_FILE" \
            --accuracy-report-file "$CI_ACCURACY_REPORT_FILE" \
            --platform "$CI_ACCURACY_PLATFORM" \
            --soc "$CI_SOC" \
            --mode "$CI_MODE" \
            --ops "$CI_OPS" \
            --exit-code "$ci_status" \
            --head-sha "$CI_ACCURACY_HEAD_SHA" \
            --run-id "$CI_ACCURACY_RUN_ID" \
            --run-attempt "$CI_ACCURACY_RUN_ATTEMPT" \
            --json-out "$CI_DIAGNOSTIC_FILE" \
            --markdown-out "$CI_SUMMARY_FILE" \
            --require-accuracy-report || summary_status=$?

          if [[ -f "$CI_SUMMARY_FILE" ]]; then
            cat "$CI_SUMMARY_FILE"
            cat "$CI_SUMMARY_FILE" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "[CI][ERROR] NPU CI 关键摘要未生成。" >&2
            summary_status=1
          fi

          if [[ "$ci_status" -ne 0 ]]; then
            exit "$ci_status"
          fi
          exit "$summary_status"

      - name: 清理 ${{ matrix.name }} 临时完整日志
        if: always()
        run: |
          set -euo pipefail
          repo_path="$(realpath repo)"
          raw_log_path="$(realpath -m "repo/${CI_RAW_LOG_FILE}")"
          case "$raw_log_path" in
            "$repo_path"/*) rm -f "$raw_log_path" ;;
            *) echo "[CI][ERROR] Refusing to clean log outside the repository workspace." >&2; exit 1 ;;
          esac

      - name: 记录 ${{ matrix.name }} 执行结果
        if: always()
        env:
          NPU_PLATFORM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p repo/.ci-tmp
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["CI_ACCURACY_PLATFORM"]
          result = {
              "schema": "npu-ci-platform-result-v1",
              "metadata": {
                  "platform": platform,
                  "soc": os.environ["CI_SOC"],
                  "head_sha": os.environ["CI_ACCURACY_HEAD_SHA"],
                  "run_id": os.environ["CI_ACCURACY_RUN_ID"],
                  "run_attempt": os.environ["CI_ACCURACY_RUN_ATTEMPT"],
              },
              "status": os.environ["NPU_PLATFORM_JOB_STATUS"],
          }
          path = Path("repo/.ci-tmp") / f"npu-ci-result-{platform}.json"
          tmp_path = path.with_suffix(path.suffix + ".tmp")
          tmp_path.write_text(json.dumps(result, indent=2), encoding="utf-8")
          tmp_path.replace(path)
          PY

      - name: 上传 ${{ matrix.name }} 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-ci-result-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repo/.ci-tmp/npu-ci-result-${{ matrix.platform }}.json
            repo/${{ env.CI_ACCURACY_REPORT_FILE }}
            repo/${{ env.CI_DIAGNOSTIC_FILE }}
            repo/${{ env.CI_SUMMARY_FILE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  finalize:
    name: 汇总 A2 + A5 NPU CI
    needs: [prepare, ascend-npu]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: 下载双平台结果
        id: download_results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: npu-ci-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: accuracy-reports
          merge-multiple: true

      - name: 发布双平台 NPU CI 状态
        if: always()
        uses: actions/github-script@v7
        env:
          NPU_MATRIX_RESULT: ${{ needs.ascend-npu.result }}
          NPU_EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NPU_EXPECTED_RUN_ID: ${{ github.run_id }}
          NPU_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const mode = ${{ toJson(needs.prepare.outputs.ci_mode) }};
            const ops = ${{ toJson(needs.prepare.outputs.ops) }};
            const prNumber = ${{ toJson(needs.prepare.outputs.pr_number) }};
            const commentId = ${{ toJson(needs.prepare.outputs.comment_id) }};
            const sha = process.env.NPU_EXPECTED_HEAD_SHA;
            const expectedRunId = process.env.NPU_EXPECTED_RUN_ID;
            const expectedRunAttempt = process.env.NPU_EXPECTED_RUN_ATTEMPT;
            const matrixResult = process.env.NPU_MATRIX_RESULT || 'failure';
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const platformDefs = [
              { key: 'a2', label: 'A2', soc: 'ascend910b' },
              { key: 'a5', label: 'A5', soc: 'ascend950' },
            ];
            const truncateDescription = (value) => value.length > 140 ? `${value.slice(0, 137)}...` : value;
            const formatValue = (value) => {
              if (typeof value === 'number') {
                return Number.isFinite(value) ? value.toExponential(3) : String(value);
              }
              if (typeof value === 'boolean') {
                return value ? 'true' : 'false';
              }
              return value === undefined || value === null || value === '' ? '-' : String(value);
            };
            const redactSecretAssignment = (match, quote, key, separator) => {
              const isSpacedLowercaseTokenVariable = !quote && key === key.toLowerCase() &&
                /(?:^|[-_])token$/.test(key) && /^\s+[:=]\s+$/.test(separator);
              return isSpacedLowercaseTokenVariable
                ? match
                : `${quote}${key}${quote}${separator}<redacted>`;
            };
            const redactHostAssignment = (match, quote, key, separator) => {
              const isSpacedLowercaseBusinessVariable = !quote &&
                ['host', 'worker', 'node'].includes(key) && /^\s+[:=]\s+$/.test(separator);
              return isSpacedLowercaseBusinessVariable
                ? match
                : `${quote}${key}${quote}${separator}<internal-host>`;
            };
            const sanitizePublicText = (value, maxLength = 800) => String(value ?? '')
              .replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g, '')
              .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '')
              .replace(/\b(?:10(?:\.\d{1,3}){3}|127(?:\.\d{1,3}){3}|169\.254(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})\b/g, '<internal-host>')
              .replace(/(?<![0-9a-f:])(?:::1|(?:f[cd][0-9a-f]{2}|fe[89ab][0-9a-f]):(?:[0-9a-f]{0,4}:){1,6}[0-9a-f]{0,4})(?![0-9a-f:])/gi, '<internal-host>')
              .replace(/(https?:\/\/)[^\s\/@:]+:[^\s\/@]+@/gi, '$1<redacted>@')
              .replace(/(?<![a-z0-9_-])(--(?:[a-z][a-z0-9]*[-_])*(?:authorization|token|password|passwd|secret|api[-_]?key|access[-_]?key|secret[-_]?key|private[-_]?key))(\s*=\s*|\s+)(?:<redacted>|"(?:\\.|[^"\\\r\n])*"|'(?:\\.|[^'\\\r\n])*'|[^\s,;\r\n}\]]+)/gi, '$1$2<redacted>')
              .replace(/(?<![a-z0-9_-])([\"']?)((?:[a-z][a-z0-9]*[-_])*(?:authorization|token|password|passwd|secret|api[-_]?key|access[-_]?key|secret[-_]?key|private[-_]?key))\1(\s*[:=]\s*)(?:<redacted>|\"(?:\\.|[^\"\\\r\n])*\"|'(?:\\.|[^'\\\r\n])*'|(?:bearer\s+|basic\s+)?[^,;\r\n}\]]+?(?=\s+[\"']?[a-z][a-z0-9_-]*[\"']?\s*[:=]|[,;\r\n}\]]|$))/gi, redactSecretAssignment)
              .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{12,}|github_pat_[A-Za-z0-9_]{12,}|glpat-[A-Za-z0-9_-]{12,})\b/gi, '<redacted>')
              .replace(/\b[a-z_][a-z0-9_.-]{0,63}@[a-z0-9_.-]+\b/gi, '<user-host>')
              .replace(/\b(?:[a-z0-9-]+\.)+(?:local|internal|corp)\b/gi, '<internal-host>')
              .replace(/(?<![a-z0-9_-])(["']?)(host(?:name)?|runner|machine|worker|node)\1(\s*[:=]\s*)(?:<internal-host>|"(?:\\.|[^"\\\r\n])*"|'(?:\\.|[^'\\\r\n])*'|[a-z0-9][a-z0-9_.-]*)/gi, redactHostAssignment)
              .replace(/\b((?:on|via|from)\s+host\s+)[a-z0-9][a-z0-9_.-]*/gi, '$1<internal-host>')
              .replace(/\b(?=[a-z0-9-]*(?:runner|worker|host|node))(?=[a-z0-9-]*\d)[a-z0-9]+(?:-[a-z0-9]+)+\b/gi, '<internal-host>')
              .replace(/[A-Za-z]:\\(?:[^\s\\]+\\)*[^\s]*/g, '<path>')
              .replace(/(?<![\w.])\/(?:data|workspace|root|home|tmp|opt|usr|var|mnt|etc|srv|run|__w|github|runner)(?:\/[^\s\"'<>:]*)*(?=$|[\s\"'<>:,;.\)\]])/g, '<path>')
              .replace(/(?<![:\/\w.])\/(?:[^\s\/\"'<>:]+\/)+[^\s\"'<>:]*/g, '<path>')
              .slice(0, maxLength);
            const sanitizeInline = (value, maxLength = 800) => sanitizePublicText(value, maxLength)
              .replace(/[\r\n\t]+/g, ' ')
              .trim();
            const sanitizeMarkdownInline = (value, maxLength = 800) => sanitizeInline(value, maxLength)
              .replace(/@/g, '_at_')
              .replace(/[`<>\[\]]/g, "'");
            const isRecord = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
            const escapeCell = (value) => sanitizeMarkdownInline(formatValue(value), 300)
              .replace(/\|/g, '\\|');
            const diagnosticLines = (value) => Array.isArray(value)
              ? value.slice(0, 4).map((line) => sanitizeInline(line, 280)).filter(Boolean)
              : [];
            const renderComment = (lines) => {
              const maxChars = 48000;
              const notice = '_其余诊断因评论长度限制已省略，完整结构化结果见平台 artifact。_';
              const kept = [];
              let used = 0;
              let truncated = false;
              for (const line of lines) {
                const value = String(line);
                if (used + value.length + 1 > maxChars - notice.length - 2) {
                  truncated = true;
                  break;
                }
                kept.push(value);
                used += value.length + 1;
              }
              if (truncated) {
                kept.push('', notice);
              }
              return kept.join('\n');
            };
            const readJson = (filePath, description, errors) => {
              if (!fs.existsSync(filePath)) {
                errors.push(`${description}未生成`);
                return null;
              }
              try {
                const parsed = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                if (parsed === null) {
                  errors.push(`${description}根节点无效`);
                  return null;
                }
                return parsed;
              } catch (error) {
                errors.push(`${description}无法解析`);
                core.warning(`Unable to parse ${filePath}: ${error.message}`);
                return null;
              }
            };
            const validateIdentity = (metadata, def, description, errors) => {
              if (!isRecord(metadata)) {
                errors.push(`${description}缺少身份信息`);
                return;
              }
              const expected = {
                platform: def.key,
                soc: def.soc,
                head_sha: sha,
                run_id: expectedRunId,
                run_attempt: expectedRunAttempt,
              };
              for (const [key, value] of Object.entries(expected)) {
                if (String(metadata[key] || '') !== String(value)) {
                  errors.push(`${description}${key}不属于本次触发`);
                }
              }
            };
            const validatePlatform = (def) => {
              const errors = [];
              const executionErrors = [];
              const accuracyErrors = [];
              const diagnosticErrors = [];
              const resultPath = path.join('accuracy-reports', `npu-ci-result-${def.key}.json`);
              const reportPath = path.join('accuracy-reports', `gdr_accuracy_report-${def.key}.json`);
              const diagnosticPath = path.join('accuracy-reports', `npu-ci-diagnostics-${def.key}.json`);
              const execution = readJson(resultPath, '执行结果', executionErrors);
              if (execution !== null) {
                if (!isRecord(execution)) {
                  executionErrors.push('执行结果根节点无效');
                } else if (execution.schema !== 'npu-ci-platform-result-v1') {
                  executionErrors.push('执行结果 schema 不受支持');
                }
                if (isRecord(execution)) {
                  validateIdentity(execution.metadata, def, '执行结果', executionErrors);
                  if (!['success', 'failure'].includes(execution.status)) {
                    executionErrors.push('执行结果 status 无效');
                  } else if (execution.status !== 'success') {
                    executionErrors.push(`执行状态为 ${execution.status || 'unknown'}`);
                  }
                }
              }
              const report = readJson(reportPath, '精度报告', accuracyErrors);
              let summary = null;
              let reportAccuracyState = null;
              if (report !== null) {
                if (!isRecord(report)) {
                  accuracyErrors.push('精度报告根节点无效');
                } else if (report.schema !== 'gdr-accuracy-report-v1') {
                  accuracyErrors.push('精度报告 schema 不受支持');
                }
                if (isRecord(report)) {
                  validateIdentity(report.metadata, def, '精度报告', accuracyErrors);
                  if (report.complete !== true) {
                    accuracyErrors.push('精度报告未完整结束');
                  }
                  const derivedExecution = { passed: 0, failed: 0, not_run: 0 };
                  const derivedAccuracy = { passed: 0, failed: 0, not_run: 0 };
                  let casesValid = true;
                  const metricFailures = [];
                  if (!Array.isArray(report.cases)) {
                    accuracyErrors.push('精度报告 cases 无效');
                    casesValid = false;
                  } else {
                    for (const [caseIndex, caseItem] of report.cases.entries()) {
                      if (!isRecord(caseItem)) {
                        accuracyErrors.push(`精度报告 case ${caseIndex} 不是对象`);
                        casesValid = false;
                        continue;
                      }
                      const caseName = sanitizeMarkdownInline(caseItem.name || `case-${caseIndex}`, 120);
                      const caseStatus = String(caseItem.status || 'unknown').toLowerCase();
                      const accuracyStatus = String(caseItem.accuracy_status || 'not_requested').toLowerCase();
                      const executionStatusValid = Object.hasOwn(derivedExecution, caseStatus);
                      const accuracyStatusValid = ['passed', 'failed', 'not_run', 'not_requested'].includes(accuracyStatus);
                      if (!executionStatusValid) {
                        accuracyErrors.push(`${caseName}: 执行状态无效`);
                        casesValid = false;
                      } else {
                        derivedExecution[caseStatus] += 1;
                      }
                      const returnCode = caseItem.return_code;
                      const returnCodeValid =
                        (caseStatus === 'passed' && Number.isInteger(returnCode) && returnCode === 0) ||
                        (caseStatus === 'failed' && Number.isInteger(returnCode) && returnCode !== 0) ||
                        (caseStatus === 'not_run' && (returnCode === null || returnCode === undefined));
                      if (executionStatusValid && !returnCodeValid) {
                        executionErrors.push(`${caseName}: 执行状态与 return_code 不一致`);
                        casesValid = false;
                      }
                      if (typeof caseItem.accuracy_check !== 'boolean' || !accuracyStatusValid) {
                        accuracyErrors.push(`${caseName}: 精度状态无效`);
                        casesValid = false;
                      }
                      const isAccuracyCase = caseItem.accuracy_check === true || accuracyStatus === 'not_run';
                      if ((caseItem.accuracy_check === true && accuracyStatus === 'not_requested') ||
                          (!isAccuracyCase && accuracyStatus !== 'not_requested')) {
                        accuracyErrors.push(`${caseName}: 精度状态与检查开关不一致`);
                        casesValid = false;
                      } else if (isAccuracyCase && Object.hasOwn(derivedAccuracy, accuracyStatus)) {
                        derivedAccuracy[accuracyStatus] += 1;
                      }
                      if (!Array.isArray(caseItem.metrics)) {
                        accuracyErrors.push(`${caseName}: metrics 无效`);
                        casesValid = false;
                        continue;
                      }
                      if (accuracyStatus === 'passed' && caseItem.metrics.length === 0) {
                        accuracyErrors.push(`${caseName}: 精度通过但缺少 metric`);
                        casesValid = false;
                      }
                      for (const [metricIndex, metric] of caseItem.metrics.entries()) {
                        if (!isRecord(metric)) {
                          accuracyErrors.push(`${caseName}: metric ${metricIndex} 不是对象`);
                          casesValid = false;
                          continue;
                        }
                        if (isAccuracyCase && ['finite', 'allclose', 'cosine_ok'].some((field) => typeof metric[field] !== 'boolean')) {
                          accuracyErrors.push(`${caseName}: metric ${metricIndex} 检查字段无效`);
                          casesValid = false;
                        }
                        if ((metric.finite === false || metric.allclose === false || metric.cosine_ok === false) && metricFailures.length < 6) {
                          metricFailures.push(`${caseName}/${sanitizeMarkdownInline(metric.tensor || 'unknown', 80)}`);
                        }
                      }
                    }
                  }
                  if (metricFailures.length > 0) {
                    accuracyErrors.push(`精度异常：${metricFailures.slice(0, 6).join('、')}`);
                  }
                  summary = report.summary;
                  if (!isRecord(summary)) {
                    accuracyErrors.push('精度报告 summary 无效');
                  } else {
                    const fields = ['total', 'passed', 'failed', 'not_run', 'accuracy_total', 'accuracy_passed', 'accuracy_failed', 'accuracy_not_run'];
                    if (fields.some((field) => !Number.isInteger(summary[field]) || summary[field] < 0)) {
                      accuracyErrors.push('精度报告计数无效');
                    } else {
                      const expected = {
                        total: Array.isArray(report.cases) ? report.cases.length : 0,
                        ...derivedExecution,
                        accuracy_total: Object.values(derivedAccuracy).reduce((sum, value) => sum + value, 0),
                        accuracy_passed: derivedAccuracy.passed,
                        accuracy_failed: derivedAccuracy.failed,
                        accuracy_not_run: derivedAccuracy.not_run,
                      };
                      if (!casesValid || fields.some((field) => summary[field] !== expected[field])) {
                        accuracyErrors.push('精度报告 summary 与 cases 不一致');
                      } else if (summary.accuracy_total === 0) {
                        reportAccuracyState = 'failure';
                        accuracyErrors.push('未发现精度检查用例');
                      } else if (summary.accuracy_failed > 0 || summary.accuracy_not_run > 0 || summary.accuracy_passed !== summary.accuracy_total) {
                        reportAccuracyState = 'failure';
                        accuracyErrors.push(
                          `精度未通过 (${summary.accuracy_passed}/${summary.accuracy_total}，失败 ${summary.accuracy_failed}，未执行 ${summary.accuracy_not_run})`
                        );
                      } else {
                        reportAccuracyState = 'success';
                      }
                    }
                  }
                }
              }
              const diagnostic = readJson(diagnosticPath, '关键诊断', diagnosticErrors);
              let diagnosticTopValid = false;
              let diagnosticExecutionValid = false;
              let diagnosticAccuracyValid = false;
              let diagnosticHasFailurePayload = false;
              if (diagnostic !== null) {
                if (!isRecord(diagnostic)) {
                  diagnosticErrors.push('关键诊断根节点无效');
                } else if (diagnostic.schema !== 'npu-ci-diagnostics-v1') {
                  diagnosticErrors.push('关键诊断 schema 不受支持');
                }
                if (isRecord(diagnostic)) {
                  validateIdentity(diagnostic.metadata, def, '关键诊断', diagnosticErrors);
                  if (!['success', 'failure'].includes(diagnostic.status)) {
                    diagnosticErrors.push('关键诊断 status 无效');
                  } else {
                    diagnosticTopValid = true;
                    if (diagnostic.status !== 'success') {
                      diagnosticErrors.push(`关键诊断状态为 ${diagnostic.status}`);
                    }
                  }
                  if (!isRecord(diagnostic.execution) ||
                      !['success', 'failure'].includes(diagnostic.execution.status) ||
                      !Number.isInteger(diagnostic.execution.exit_code)) {
                    diagnosticErrors.push('关键诊断 execution 无效');
                  } else {
                    diagnosticExecutionValid = true;
                    if ((diagnostic.execution.exit_code === 0) !== (diagnostic.execution.status === 'success')) {
                      diagnosticErrors.push('关键诊断 execution 状态与退出码不一致');
                    }
                  }
                  const diagnosticAccuracyFields = ['total', 'passed', 'failed', 'not_run'];
                  if (!isRecord(diagnostic.accuracy) ||
                      !['success', 'failure', 'not_available'].includes(diagnostic.accuracy.status) ||
                      !Array.isArray(diagnostic.accuracy.failures) ||
                      diagnosticAccuracyFields.some((field) =>
                        !Number.isInteger(diagnostic.accuracy[field]) || diagnostic.accuracy[field] < 0)) {
                    diagnosticErrors.push('关键诊断 accuracy 无效');
                  } else {
                    diagnosticAccuracyValid = true;
                    if (diagnostic.accuracy.failures.length > 0) {
                      diagnosticHasFailurePayload = true;
                      if (diagnostic.accuracy.status === 'success') {
                        accuracyErrors.push('关键诊断精度成功但包含失败用例');
                      }
                    }
                    for (const [failureIndex, failure] of diagnostic.accuracy.failures.entries()) {
                      if (!isRecord(failure) || !Array.isArray(failure.metrics)) {
                        diagnosticErrors.push(`关键诊断 accuracy failure ${failureIndex} 无效`);
                        continue;
                      }
                      for (const [metricIndex, metric] of failure.metrics.entries()) {
                        if (!isRecord(metric) || !isRecord(metric.details)) {
                          diagnosticErrors.push(`关键诊断 accuracy metric ${failureIndex}/${metricIndex} 无效`);
                        }
                      }
                    }
                  }
                  if (!isRecord(diagnostic.diagnostics)) {
                    diagnosticErrors.push('关键诊断 diagnostics 无效');
                  } else {
                    for (const category of ['compile', 'runtime', 'infrastructure']) {
                      const blocks = diagnostic.diagnostics[category];
                      if (!Array.isArray(blocks)) {
                        diagnosticErrors.push(`关键诊断 ${category} 无效`);
                        continue;
                      }
                      if (blocks.length > 0) {
                        diagnosticHasFailurePayload = true;
                      }
                      for (const [blockIndex, block] of blocks.entries()) {
                        if (!isRecord(block) || !Array.isArray(block.lines) ||
                            block.lines.some((line) => typeof line !== 'string')) {
                          diagnosticErrors.push(`关键诊断 ${category} block ${blockIndex} 无效`);
                        }
                      }
                    }
                  }
                  if (!Array.isArray(diagnostic.reproduction) ||
                      diagnostic.reproduction.some((line) => typeof line !== 'string')) {
                    diagnosticErrors.push('关键诊断 reproduction 无效');
                  } else if (diagnostic.reproduction.length > 0) {
                    diagnosticHasFailurePayload = true;
                  }
                  if (diagnosticTopValid && diagnosticExecutionValid && diagnosticAccuracyValid) {
                    const expectedDiagnosticStatus =
                      diagnostic.execution.status === 'success' &&
                      diagnostic.accuracy.status === 'success' &&
                      !diagnosticHasFailurePayload
                        ? 'success'
                        : 'failure';
                    if (diagnostic.status !== expectedDiagnosticStatus) {
                      diagnosticErrors.push('关键诊断顶层状态与 execution/accuracy 不一致');
                    }
                  }
                  if (diagnosticTopValid && isRecord(execution) &&
                      ['success', 'failure'].includes(execution.status) &&
                      execution.status !== diagnostic.status) {
                    diagnosticErrors.push('执行结果与关键诊断顶层状态不一致');
                  }
                  if (diagnosticAccuracyValid && reportAccuracyState !== null) {
                    const countsMatch =
                      diagnostic.accuracy.total === summary.accuracy_total &&
                      diagnostic.accuracy.passed === summary.accuracy_passed &&
                      diagnostic.accuracy.failed === summary.accuracy_failed &&
                      diagnostic.accuracy.not_run === summary.accuracy_not_run;
                    if (diagnostic.accuracy.status !== reportAccuracyState || !countsMatch) {
                      accuracyErrors.push('关键诊断 accuracy 与精度报告不一致');
                    }
                  }
                }
              }
              errors.push(...executionErrors, ...accuracyErrors, ...diagnosticErrors);
              return {
                ...def,
                execution,
                report,
                diagnostic,
                summary,
                executionOk: executionErrors.length === 0 && diagnosticErrors.length === 0,
                accuracyOk: accuracyErrors.length === 0,
                executionErrors,
                accuracyErrors,
                diagnosticErrors,
                errors,
              };
            };

            let currentHeadSha = '';
            let headCheckError = '';
            try {
              const { data: currentPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              currentHeadSha = currentPr.head.sha;
            } catch (error) {
              headCheckError = error.message;
              core.warning(`Unable to inspect current PR head before publishing NPU CI status: ${error.message}`);
            }
            const staleRun = Boolean(currentHeadSha) && currentHeadSha !== sha;
            const platforms = platformDefs.map(validatePlatform);
            const matrixArtifactMismatch = matrixResult !== 'success' &&
              platforms.every((item) => item.executionOk && item.accuracyOk);
            const matrixFailureReason = matrixArtifactMismatch
              ? `执行矩阵状态为 ${sanitizeMarkdownInline(matrixResult, 40)}，但双平台 artifact 均记录为通过；请查看失败 job 或 post-action。`
              : '';
            const executionOk = !headCheckError && !staleRun && matrixResult === 'success' && platforms.every((item) => item.executionOk);
            const accuracyOk = !headCheckError && !staleRun && platforms.every((item) => item.accuracyOk);
            const invalidReason = headCheckError
              ? '无法确认 PR head，本次 A2+A5 结果失效'
              : (staleRun ? 'PR head 已变化，本次 A2+A5 结果失效' : '');
            const executionDescription = invalidReason || matrixFailureReason || (
              executionOk
                ? `NPU CI 通过 (${mode}+example,A2+A5)`
                : `NPU CI 失败 (${mode}+example,A2+A5)`
            );
            const accuracyTotals = platforms.reduce(
              (totals, item) => {
                if (item.summary) {
                  totals.total += Number(item.summary.accuracy_total || 0);
                  totals.passed += Number(item.summary.accuracy_passed || 0);
                  totals.failed += Number(item.summary.accuracy_failed || 0);
                  totals.notRun += Number(item.summary.accuracy_not_run || 0);
                }
                return totals;
              },
              { total: 0, passed: 0, failed: 0, notRun: 0 }
            );
            const failedPlatformSummary = platforms
              .filter((item) => !item.accuracyOk)
              .map((item) => `${item.label}: ${item.accuracyErrors.join('；') || '精度失败'}`)
              .join('；');
            const accuracyDescription = invalidReason || (accuracyOk
              ? `A2+A5 精度通过：${accuracyTotals.passed}/${accuracyTotals.total} 个用例`
              : truncateDescription(`A2+A5 精度失败：${failedPlatformSummary || '报告不完整'}`));

            await Promise.all([
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: executionOk ? 'success' : 'failure',
                context: 'NPU CI / A2+A5 手动验证',
                description: truncateDescription(executionDescription),
                target_url: targetUrl,
              }),
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: accuracyOk ? 'success' : 'failure',
                context: 'NPU CI / A2+A5 精度检查',
                description: truncateDescription(accuracyDescription),
                target_url: targetUrl,
              }),
            ]);

            const commentBody = [
              `<!-- npu-ci:pr=${prNumber}:sha=${sha} -->`,
              `NPU CI ${executionOk && accuracyOk ? '通过' : '失败'}：\`${sha}\`。`,
              '',
              `- 模式：\`${sanitizeMarkdownInline(mode, 40)}\``,
              `- 触发人：@${context.actor}`,
              '- 验证平台：A2 (`ascend910b`) + A5 (`ascend950`)',
              invalidReason ? `- 失效原因：${invalidReason}` : null,
              `- 执行矩阵：\`${sanitizeMarkdownInline(matrixResult, 40)}\``,
              matrixFailureReason ? `- 汇总异常：${matrixFailureReason}` : null,
              '- Example ST：两平台均必跑',
              `- 精度检查：${accuracyDescription}`,
              ops ? `- 算子：\`${sanitizeMarkdownInline(ops, 500)}\`` : null,
              `- 运行链接：[NPU CI #${context.runNumber}](${targetUrl})`,
              '',
              '### 双平台汇总',
              '',
              '| 平台 | SOC | 执行 | 精度 | 精度用例 | 说明 |',
              '| --- | --- | --- | --- | --- | --- |',
              ...platforms.map((item) => {
                const summary = item.summary || {};
                const accuracyCases = Number.isInteger(summary.accuracy_passed) && Number.isInteger(summary.accuracy_total)
                  ? `${summary.accuracy_passed}/${summary.accuracy_total}`
                  : '-/-';
                return `| ${item.label} | \`${item.soc}\` | ${item.executionOk ? '通过' : '失败'} | ${item.accuracyOk ? '通过' : '失败'} | ${escapeCell(accuracyCases)} | ${escapeCell(item.errors.join('；'))} |`;
              }),
            ].filter((line) => line !== null);

            const categoryLabels = {
              compile: '编译错误',
              runtime: '运行异常',
              infrastructure: 'CI 环境异常',
            };
            for (const item of platforms.filter((platform) => !platform.executionOk || !platform.accuracyOk)) {
              commentBody.push('', `### ${item.label} 关键诊断`, '');
              let detailAdded = false;
              const groups = item.diagnostic && item.diagnostic.diagnostics;
              if (groups && typeof groups === 'object') {
                for (const category of ['compile', 'runtime', 'infrastructure']) {
                  const blocks = Array.isArray(groups[category]) ? groups[category].slice(0, 2) : [];
                  for (const block of blocks) {
                    const lines = diagnosticLines(block && block.lines);
                    if (lines.length === 0) {
                      continue;
                    }
                    const rawOccurrences = Number(block.occurrences || 1);
                    const occurrences = Number.isSafeInteger(rawOccurrences) && rawOccurrences > 1
                      ? Math.min(rawOccurrences, 9999)
                      : 1;
                    commentBody.push(`#### ${categoryLabels[category]}${occurrences > 1 ? `（重复 ${occurrences} 次）` : ''}`, '');
                    commentBody.push(...lines.map((line) => `    ${line}`), '');
                    detailAdded = true;
                  }
                }
              }

              const accuracy = item.diagnostic && item.diagnostic.accuracy;
              const failures = accuracy && Array.isArray(accuracy.failures)
                ? accuracy.failures.filter(isRecord).slice(0, 4)
                : [];
              if (failures.length > 0) {
                commentBody.push('#### 精度异常', '');
                commentBody.push('| 用例 | Tensor | 失败判据 | tol | cosine / cos_min | max_abs | bad_frac | 退出码 |');
                commentBody.push('| --- | --- | --- | --- | --- | --- | --- | --- |');
                for (const failure of failures) {
                  const validMetrics = Array.isArray(failure.metrics)
                    ? failure.metrics.filter(isRecord).slice(0, 3)
                    : [];
                  const metrics = validMetrics.length > 0
                    ? validMetrics
                    : [{ output: '-', status: failure.status || 'failed', details: {} }];
                  for (const metric of metrics) {
                    const details = isRecord(metric.details) ? metric.details : {};
                    const failedChecks = ['finite', 'allclose', 'cosine_ok']
                      .filter((field) => details[field] === false)
                      .map((field) => `${field}=false`);
                    const criterion = failedChecks.join(', ') || metric.status || failure.status || 'failed';
                    commentBody.push(
                      `| ${escapeCell(failure.name)} | ${escapeCell(metric.output)} | ${escapeCell(criterion)} | ` +
                      `${escapeCell(details.tol)} | ${escapeCell(details.cosine)} / ${escapeCell(details.cos_min)} | ` +
                      `${escapeCell(details.max_abs)} | ${escapeCell(details.bad_frac)} | ${escapeCell(failure.return_code)} |`
                    );
                  }
                }
                detailAdded = true;
              }

              const reproduction = item.diagnostic && Array.isArray(item.diagnostic.reproduction)
                ? item.diagnostic.reproduction.filter((line) => typeof line === 'string').slice(0, 2).map((line) => sanitizeInline(line, 2400)).filter(Boolean)
                : [];
              if (reproduction.length > 0) {
                commentBody.push('', '#### 复现命令', '', ...reproduction.map((line) => `    ${line}`));
                detailAdded = true;
              }

              if (!detailAdded) {
                const fallback = item.errors.length > 0 ? item.errors : ['未生成可用的关键诊断，请查看对应平台 job。'];
                commentBody.push(...fallback.slice(0, 5).map((line) => `- ${sanitizeMarkdownInline(line, 300)}`));
              }
            }

            if (executionOk && accuracyOk) {
              commentBody.push('', '全部检查通过；成功用例的逐 Tensor 指标已收纳到平台 artifact，不在评论中重复展开。');
            }

            try {
              const body = renderComment(commentBody);
              if (commentId) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: Number(commentId),
                  body,
                });
              } else if (prNumber) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(prNumber),
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to create or update PR comment: ${error.message}`);
            }

            if (!executionOk || !accuracyOk) {
              core.setFailed('A2+A5 NPU CI 汇总未通过。');
            }
