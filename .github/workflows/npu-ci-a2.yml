name: NPU CI · A2

run-name: 'NPU CI · A2 · PR #${{ inputs.pr_number }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to run NPU CI for"
        required: true
      ci_mode:
        description: "CI mode: quick or full"
        required: false
        default: quick
      ops:
        description: "Optional comma-separated operator list for compile diagnostics only"
        required: false
        default: ''
      requested_by:
        description: "Original Admin requester; set by the PR comment dispatcher"
        required: false
        default: ''
      force:
        description: "Force a rerun even if A2 already passed on this commit"
        required: false
        default: 'false'
      require_healthy_npu:
        description: "Require a healthy NPU (npu-smi Health=OK) before running"
        required: false
        default: 'true'

concurrency:
  group: npu-ci-a2-${{ github.repository }}-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  a2:
    name: A2 分项执行
    uses: ./.github/workflows/npu-ci-platform.yml
    with:
      platform: a2
      name: A2 / ascend910b
      soc: ascend910b
      image: fla-npu-ci:9.1.0-910b
      dockerfile: ci/Dockerfile
      require_preloaded_image: 'false'
      runner_labels: '["self-hosted","linux","arm64","npu","flash-linear-attention-npu"]'
      pr_number: ${{ inputs.pr_number }}
      ci_mode: ${{ inputs.ci_mode }}
      ops: ${{ inputs.ops }}
      requested_by: ${{ inputs.requested_by }}
      force: ${{ inputs.force }}
      require_healthy_npu: ${{ inputs.require_healthy_npu }}
