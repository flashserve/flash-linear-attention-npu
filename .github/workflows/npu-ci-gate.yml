# A2 and A5 run as two independent workflows. This gate merges their artifacts and
# publishes the six aggregate `NPU CI / A2+A5 / 0X` contexts, so branch protection
# keeps working with a single set of required checks.
name: NPU CI 汇总

run-name: 'NPU CI 汇总 · ${{ github.event.workflow_run.display_title }}'

on:
  workflow_run:
    workflows: ['NPU CI · A2', 'NPU CI · A5']
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: npu-ci-gate-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.display_title }}
  cancel-in-progress: false

jobs:
  publish:
    name: 校验并发布 A2 + A5 分项状态
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出行信任的状态发布脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: trusted-ci
          sparse-checkout: |
            .github/scripts/publish_npu_ci_status.js
            .github/scripts/npu_ci_checks.js
            .github/scripts/npu_ci_checks.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 解析双平台执行结果
        id: resolve
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const workflowRun = context.payload.workflow_run;
            const title = `${workflowRun.display_title || ''} ${workflowRun.name || ''}`;
            const prMatch = title.match(/PR #(\d+)/);
            if (!prMatch) {
              core.notice('无法从运行标题解析 PR 编号，跳过汇总。');
              core.setOutput('ready', 'false');
              return;
            }
            const prNumber = Number(prMatch[1]);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100,
            });
            const recency = (a, b) =>
              new Date(b.created_at) - new Date(a.created_at) || Number(b.id || 0) - Number(a.id || 0);
            const parsePlatform = (label) => {
              const latest = statuses
                .filter((item) => item.context === `NPU CI / ${label} 平台执行`)
                .sort(recency)[0];
              if (!latest) {
                return null;
              }
              const match = (latest.description || '')
                .match(/\(([^,()]+),([^,()]+),(A2|A5)\)\s+run=(\d+)\s+attempt=(\d+)/);
              if (!match) {
                return { status: latest, invalid: true };
              }
              return {
                status: latest,
                mode: match[1],
                requestKey: match[2],
                runId: match[4],
                runAttempt: match[5],
              };
            };
            const a2 = parsePlatform('A2');
            const a5 = parsePlatform('A5');
            if (!a2 || !a5 || a2.invalid || a5.invalid) {
              core.notice('两平台尚未都产出可识别的执行状态，等待另一平台完成后再次汇总。');
              core.setOutput('ready', 'false');
              return;
            }
            if (a2.status.state === 'pending' || a5.status.state === 'pending') {
              core.notice('仍有平台在排队或运行中，本次不汇总。');
              core.setOutput('ready', 'false');
              return;
            }
            if (a2.mode !== a5.mode || a2.requestKey !== a5.requestKey) {
              core.warning(
                'A2 与 A5 的执行请求不一致 ' +
                `(A2: ${a2.mode}/${a2.requestKey}, A5: ${a5.mode}/${a5.requestKey})，` +
                '请用同一模式与 ops 重新触发两个平台。'
              );
              core.setOutput('ready', 'false');
              return;
            }
            const platformRuns = {
              a2: { run_id: a2.runId, run_attempt: a2.runAttempt },
              a5: { run_id: a5.runId, run_attempt: a5.runAttempt },
            };
            const platformConclusions = {
              a2: a2.status.state === 'success' ? 'success'
                : (a2.status.state === 'error' ? 'cancelled' : 'failure'),
              a5: a5.status.state === 'success' ? 'success'
                : (a5.status.state === 'error' ? 'cancelled' : 'failure'),
            };
            const matrixResult = Object.values(platformConclusions).every((item) => item === 'success')
              ? 'success'
              : 'failure';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const marker = `<!-- npu-ci:pr=${prNumber}:sha=${headSha} -->`;
            const existing = comments
              .filter((comment) => typeof comment.body === 'string' && comment.body.includes(marker))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            core.setOutput('ready', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', headSha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('mode', a2.mode);
            core.setOutput('matrix_result', matrixResult);
            core.setOutput('platform_runs', JSON.stringify(platformRuns));
            core.setOutput('platform_conclusions', JSON.stringify(platformConclusions));
            core.setOutput('comment_id', existing ? String(existing.id) : '');
            core.notice(`汇总 ${prNumber}@${headSha}：A2=${platformConclusions.a2}, A5=${platformConclusions.a5}`);

      - name: 下载 A2 结果
        if: steps.resolve.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: npu-ci-result-a2-*
          path: accuracy-reports
          merge-multiple: false
          run-id: ${{ fromJSON(steps.resolve.outputs.platform_runs).a2.run_id }}
          github-token: ${{ github.token }}

      - name: 下载 A5 结果
        if: steps.resolve.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: npu-ci-result-a5-*
          path: accuracy-reports
          merge-multiple: false
          run-id: ${{ fromJSON(steps.resolve.outputs.platform_runs).a5.run_id }}
          github-token: ${{ github.token }}

      - name: 读取平台请求元数据
        id: meta
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'accuracy-reports';
            const readMeta = (platform) => {
              let entries = [];
              try {
                entries = fs.readdirSync(root, { withFileTypes: true });
              } catch (error) {
                return null;
              }
              for (const entry of entries) {
                if (!entry.isDirectory()) {
                  continue;
                }
                const metaPath = path.join(root, entry.name, `npu-ci-meta-${platform}.json`);
                if (fs.existsSync(metaPath)) {
                  try {
                    return JSON.parse(fs.readFileSync(metaPath, 'utf8'));
                  } catch (error) {
                    core.warning(`无法解析 ${metaPath}: ${error.message}`);
                  }
                }
              }
              return null;
            };
            const metas = { a2: readMeta('a2'), a5: readMeta('a5') };
            const opsValues = [metas.a2 && metas.a2.ops, metas.a5 && metas.a5.ops]
              .filter((item) => typeof item === 'string');
            core.setOutput('ops', opsValues.length > 0 ? opsValues[0] : '');

      - name: 发布双平台 NPU CI 状态
        id: publish_statuses
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/github-script@v8
        env:
          NPU_CI_MODE: ${{ steps.resolve.outputs.mode }}
          NPU_OPS: ${{ steps.meta.outputs.ops }}
          NPU_PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          NPU_COMMENT_ID: ${{ steps.resolve.outputs.comment_id }}
          NPU_MATRIX_RESULT: ${{ steps.resolve.outputs.matrix_result }}
          NPU_EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          NPU_EXPECTED_BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          NPU_EXPECTED_BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          NPU_PLATFORM_RUNS: ${{ steps.resolve.outputs.platform_runs }}
          NPU_PLATFORM_CONCLUSIONS: ${{ steps.resolve.outputs.platform_conclusions }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publishNpuCiStatus = require(
              `${process.env.GITHUB_WORKSPACE}/trusted-ci/.github/scripts/publish_npu_ci_status.js`
            );
            await publishNpuCiStatus({ github, context, core });

      - name: 状态发布异常时收敛全部分项
        if: always() && steps.resolve.outputs.ready == 'true' && steps.publish_statuses.outputs.statuses_published != 'true'
        uses: actions/github-script@v8
        env:
          NPU_EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          NPU_OPS: ${{ steps.meta.outputs.ops }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.NPU_EXPECTED_HEAD_SHA;
            const checks = require(`${process.env.GITHUB_WORKSPACE}/trusted-ci/.github/scripts/npu_ci_checks.js`);
            const contexts = checks.prepareChecks.map((item) => item[0]);
            const scopedContext = checks.diagnostic.context;
            const normalizedOps = [...new Set(
              (process.env.NPU_OPS || '').split(',').map((item) => item.trim()).filter(Boolean)
            )].sort().join(',');
            const statusContexts = normalizedOps ? [scopedContext] : contexts;
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!/^[0-9a-f]{40}$/.test(sha || '')) {
              core.setFailed('无法确定要收敛的 PR head commit。');
              return;
            }
            const results = await Promise.allSettled(statusContexts.map((statusContext) =>
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'failure',
                context: statusContext,
                description: '状态发布流程异常，请重新运行 NPU CI',
                target_url: targetUrl,
              })
            ));
            const failures = results.filter((result) => result.status === 'rejected');
            if (failures.length > 0) {
              core.setFailed(`仍有 ${failures.length} 个 NPU CI 分项状态未能收敛。`);
            }
