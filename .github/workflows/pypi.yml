name: Publish to PyPI (per-tier a2/a3/a5)

on:
  workflow_dispatch:
    inputs:
      pypi_repo:
        description: "Target index: testpypi or pypi"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      dry_run:
        description: "Only build wheels, skip upload"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing (OIDC) to PyPI

jobs:
  build:
    name: "build ${{ matrix.soc }} / ${{ matrix.arch }}"
    runs-on: [self-hosted, linux, npu]
    strategy:
      fail-fast: false
      matrix:
        soc: [ascend910b, ascend910_93, ascend950]
        arch: [aarch64, x86_64]
    # NOTE: matrix.arch must match the runner's real CPU arch (the wheel embeds
    # arch-specific OPP host libraries); FLA_NPU_ARCH only labels the wheel.
    env:
      FLA_NPU_PYPI: "TRUE"
      FLA_NPU_DISABLE_LOCAL_VERSION: "TRUE"
      FLA_NPU_BUILD_OFFLINE_BUNDLE: "TRUE"
      FLA_NPU_SOC: ${{ matrix.soc }}
      FLA_NPU_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare env
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q -r requirements.txt
      - name: Build wheel
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python scripts/build_wheel.py
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.soc }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: "Publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}"
    needs: build
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Configure PyPI trusted publishers (OIDC) for each project with this
    # workflow + environment:
    #   - flash-linear-attention-npu-a2 (environment "pypi"/"testpypi")
    #   - flash-linear-attention-npu-a3
    #   - flash-linear-attention-npu-a5
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Split wheels by tier and twine check
        run: |
          python -m pip install -q twine
          mkdir -p dist-a2 dist-a3 dist-a5
          for f in dist/*.whl; do
            case "$f" in
              *_a2-*) mv "$f" dist-a2/ ;;
              *_a3-*) mv "$f" dist-a3/ ;;
              *_a5-*) mv "$f" dist-a5/ ;;
              *) echo "unexpected wheel: $f"; exit 1 ;;
            esac
          done
          python -m twine check dist-a2/*.whl dist-a3/*.whl dist-a5/*.whl
      - name: Publish a2
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-a2
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
      - name: Publish a3
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-a3
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
      - name: Publish a5
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-a5
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
