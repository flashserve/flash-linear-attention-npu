name: Publish to PyPI (per-tier a2/a3/a5)

on:
  workflow_dispatch:
    inputs:
      pypi_repo:
        description: "Target index: testpypi or pypi"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      dry_run:
        description: "Only build wheels, skip upload"
        type: boolean
        default: true
      soc:
        description: "Soc to build (all = 910b + 910_93 + 950)"
        type: choice
        options:
          - all
          - ascend910b
          - ascend910_93
          - ascend950
        default: all
      arch:
        description: "Arch to build (all = aarch64 + x86_64)"
        type: choice
        options:
          - all
          - aarch64
          - x86_64
        default: all
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing (OIDC) to PyPI

jobs:
  build:
    name: "build ${{ matrix.soc }} / ${{ matrix.arch }}"
    # On tag push (inputs empty) build everything; on manual dispatch only the
    # selected soc/arch rows run so a single test runner is enough.
    if: ${{ github.event_name == 'push' || ((inputs.soc == 'all' || inputs.soc == matrix.soc) && (inputs.arch == 'all' || inputs.arch == matrix.arch)) }}
    runs-on: [self-hosted, linux, npu]
    strategy:
      fail-fast: false
      matrix:
        soc: [ascend910b, ascend910_93, ascend950]
        arch: [aarch64, x86_64]
    # NOTE: matrix.arch must match the runner's real CPU arch (the wheel embeds
    # arch-specific OPP host libraries); FLA_NPU_ARCH only labels the wheel.
    env:
      FLA_NPU_PYPI: "TRUE"
      FLA_NPU_DISABLE_LOCAL_VERSION: "TRUE"
      FLA_NPU_BUILD_OFFLINE_BUNDLE: "TRUE"
      FLA_NPU_SOC: ${{ matrix.soc }}
      FLA_NPU_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare env
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q -r requirements.txt
      - name: Build wheel
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python scripts/build_wheel.py
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.soc }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: "Publish ${{ matrix.tier }} to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}"
    needs: build
    if: ${{ (github.event_name == 'push' || !inputs.dry_run) && (inputs.soc == 'all' || inputs.soc == matrix.soc) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: a2
            soc: ascend910b
            env_pypi: pypi-a2
            env_testpypi: testpypi-a2
          - tier: a3
            soc: ascend910_93
            env_pypi: pypi-a3
            env_testpypi: testpypi-a3
          - tier: a5
            soc: ascend950
            env_pypi: pypi-a5
            env_testpypi: testpypi-a5
    # PyPI requires one trusted publisher configuration per project name; the
    # (owner + repository + workflow file + environment) tuple must be unique.
    # Each tier therefore uses its own environment:
    #   pypi.org      -> pypi-a2 / pypi-a3 / pypi-a5
    #   test.pypi.org -> testpypi-a2 / testpypi-a3 / testpypi-a5
    environment: ${{ github.event_name == 'push' && matrix.env_pypi || matrix.env_testpypi }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Filter tier wheels and twine check
        run: |
          python -m pip install -q twine
          mkdir -p "dist-${{ matrix.tier }}"
          shopt -s nullglob
          files=(dist/*_${{ matrix.tier }}-*.whl)
          if (( ${#files[@]} == 0 )); then
            echo "no wheels found for tier ${{ matrix.tier }}"; exit 1
          fi
          mv "${files[@]}" "dist-${{ matrix.tier }}/"
          python -m twine check "dist-${{ matrix.tier }}"/*.whl
      - name: Publish ${{ matrix.tier }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-${{ matrix.tier }}
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
