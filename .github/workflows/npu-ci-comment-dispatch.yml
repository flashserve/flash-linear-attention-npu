name: NPU CI 评论分发

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  dispatch:
    name: 选择目标分支 NPU CI
    if: >-
      github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '/run-npu-ci')
    runs-on: ubuntu-latest
    steps:
      - name: 检出 CI 权限检查脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          sparse-checkout: |
            .github/scripts/npu_ci_authorization.js
            .github/scripts/npu_ci_checks.js
            .github/scripts/npu_ci_checks.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 分发到 PR 目标分支
        uses: actions/github-script@v8
        env:
          NPU_CI_AUTH_SCRIPT: ${{ github.workspace }}/ci-control/.github/scripts/npu_ci_authorization.js
          NPU_CI_CHECKS_SCRIPT: ${{ github.workspace }}/ci-control/.github/scripts/npu_ci_checks.js
          NPU_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const auth = require(process.env.NPU_CI_AUTH_SCRIPT || './.github/scripts/npu_ci_authorization.js');
            const checks = require(process.env.NPU_CI_CHECKS_SCRIPT || './.github/scripts/npu_ci_checks.js');
            const body = (context.payload.comment.body || '').trim();
            const command = body.match(/^\/run-npu-ci(?:\s+([\s\S]*))?$/);
            if (!command) {
              core.notice('评论包含 /run-npu-ci，但命令格式不正确，跳过。');
              return;
            }

            const parts = command[1] ? command[1].trim().split(/\s+/) : [];
            let ciMode = 'quick';
            let modeProvided = false;
            let ops = '';
            let opsProvided = false;
            for (const part of parts) {
              if (part === 'quick' || part === 'full') {
                if (modeProvided) {
                  core.setFailed('CI 模式只能指定一次。');
                  return;
                }
                ciMode = part;
                modeProvided = true;
              } else if (part.startsWith('ops=')) {
                if (opsProvided) {
                  core.setFailed('ops 参数只能指定一次。');
                  return;
                }
                ops = part.slice('ops='.length);
                opsProvided = true;
              } else {
                core.setFailed(`不支持的 NPU CI 参数：${part}`);
                return;
              }
            }

            const opsItems = ops.split(',').map((item) => item.trim());
            if ((opsProvided && !ops.trim()) ||
                (ops.trim() && opsItems.some((item) =>
                  !item || !/^[A-Za-z0-9_][A-Za-z0-9_.-]*$/.test(item)))) {
              core.setFailed('ops 参数必须是以逗号分隔的合法非空算子名。');
              return;
            }

            const actor = context.actor;
            await auth.authorizeCiRequest({ github, context, requestedBy: actor });

            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            auth.requireOpenPullRequest(pr);
            const targetRef = pr.base.ref;
            const { data: baseBranch } = await github.rest.repos.getBranch({ ...context.repo, branch: targetRef });
            auth.requireProtectedBase({ pr, branch: baseBranch });

            if (await auth.hasCiChanges({ github, context, pr })) {
              try {
                await auth.requireCiAuthorAdmin({ github, context, pr });
              } catch (error) {
                const contexts = ops.trim() ? [checks.diagnostic.context] : checks.contexts;
                await Promise.all(contexts.map((statusContext) => github.rest.repos.createCommitStatus({
                  ...context.repo, sha: pr.head.sha, state: 'failure', context: statusContext,
                  description: 'CI 文件变更仅允许仓库 Admin 作者提交', target_url: pr.html_url,
                })));
                await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber,
                  body: `NPU CI 拒绝分发。\n\n原因及修改建议：${error.message}` });
                core.setFailed(error.message);
                return;
              }
            }

            let workflowFile;
            try {
              ({ data: workflowFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/workflows/ci.yml',
                ref: baseBranch.commit.sha,
              }));
            } catch (error) {
              core.setFailed(`分支 \`${targetRef}\` 不包含 .github/workflows/ci.yml：${error.message}`);
              return;
            }
            if (Array.isArray(workflowFile) ||
                workflowFile.type !== 'file' ||
                !workflowFile.content) {
              core.setFailed(`分支 \`${targetRef}\` 的 .github/workflows/ci.yml 不是可读取的文件。`);
              return;
            }
            const workflowText = Buffer
              .from(workflowFile.content, workflowFile.encoding || 'base64')
              .toString('utf8');

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: targetRef,
              inputs: auth.selectDispatchInputs(workflowText, {
                pr_number: String(prNumber),
                ci_mode: ciMode,
                ops,
                requested_by: actor,
                expected_head_sha: pr.head.sha,
                expected_base_ref: pr.base.ref,
                expected_base_sha: baseBranch.commit.sha,
                expected_workflow_sha: baseBranch.commit.sha,
              }),
            });

            core.notice(
              `已将 PR #${prNumber} 的 NPU CI 分发到 \`${targetRef}\`，` +
              `head=${pr.head.sha}，模式=${ciMode}。`
            );

  dispatch-package:
    name: 分发 Package 编译
    if: >-
      github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '/package')
    runs-on: ubuntu-latest
    steps:
      - name: 检出 CI 权限检查脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          sparse-checkout: .github/scripts/npu_ci_authorization.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 分发到 package workflow
        uses: actions/github-script@v8
        env:
          NPU_CI_AUTH_SCRIPT: ${{ github.workspace }}/ci-control/.github/scripts/npu_ci_authorization.js
          NPU_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const auth = require(process.env.NPU_CI_AUTH_SCRIPT || './.github/scripts/npu_ci_authorization.js');
            const body = (context.payload.comment.body || '').trim();
            const command = body.match(/^\/package(?:\s+([\s\S]*))?$/);
            if (!command) {
              core.notice('评论包含 /package，但命令格式不正确，跳过。');
              return;
            }

            const SOCS = ['ascend910b', 'ascend910_93', 'ascend950'];
            const ARCHES = ['arm', 'x86'];
            const parts = command[1] ? command[1].trim().split(/\s+/) : [];
            let socs = [];
            let arches = [];
            let branch = '';
            let jobs = '';
            for (const part of parts) {
              if (part.startsWith('soc=')) {
                if (socs.length > 0) {
                  core.setFailed('soc 参数只能指定一次。');
                  return;
                }
                socs = part.slice('soc='.length)
                  .split(',').map((item) => item.trim()).filter(Boolean);
                if (!socs.length || socs.some((item) => !SOCS.includes(item))) {
                  core.setFailed(`soc 参数不合法，可选值: ${SOCS.join(', ')}`);
                  return;
                }
              } else if (part.startsWith('arch=')) {
                if (arches.length > 0) {
                  core.setFailed('arch 参数只能指定一次。');
                  return;
                }
                arches = part.slice('arch='.length)
                  .split(',').map((item) => item.trim()).filter(Boolean);
                if (!arches.length || arches.some((item) => !ARCHES.includes(item))) {
                  core.setFailed(`arch 参数不合法，可选值: ${ARCHES.join(', ')}`);
                  return;
                }
              } else if (part.startsWith('jobs=')) {
                if (jobs) {
                  core.setFailed('jobs 参数只能指定一次。');
                  return;
                }
                jobs = part.slice('jobs='.length);
                if (!/^[1-9][0-9]*$/.test(jobs) || !Number.isSafeInteger(Number(jobs))) {
                  core.setFailed('jobs 参数必须是正整数，例如 /package jobs=16。');
                  return;
                }
              } else if (part.startsWith('branch=')) {
                if (branch) {
                  core.setFailed('branch 参数只能指定一次。');
                  return;
                }
                branch = part.slice('branch='.length).trim();
                if (!branch) {
                  core.setFailed('branch 参数不能为空。');
                  return;
                }
              } else {
                core.setFailed(
                  `不支持的参数: ${part}。用法: /package ` +
                  `[soc=ascend910b,ascend910_93,ascend950] ` +
                  `[arch=arm,x86] [branch=<分支名|head>] [jobs=16]`);
                return;
              }
            }
            if (!socs.length) socs = SOCS;
            if (!arches.length) arches = ARCHES;
            if (!jobs) jobs = '16';

            const actor = context.actor;
            await auth.authorizeCiRequest({ github, context, requestedBy: actor });

            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} 仍是草稿，请先标记为 ready for review 后再触发 Package 编译。`);
              return;
            }
            if (await auth.hasCiChanges({ github, context, pr })) {
              await auth.requireCiAuthorAdmin({ github, context, pr });
            }

            // 出包代码来源: 不指定 branch 时默认编译 PR 合并结果，即
            // base 分支 + 当前 PR 改动 (GitHub 维护的 merge_commit_sha，
            // 等价于 PR 合入后的代码)；branch=<分支名> 编译当前仓任意分支；
            // branch=head 特指 PR 自身代码 (fork PR 亦可，不含 base 最新
            // 改动)。SHA 在分发时锁定，保证整次编译的产物命名 / 检出代码
            // 一致
            let buildRef = '';
            let buildSha = '';
            let buildRepo = '';
            if (branch === 'head') {
              buildRef = pr.head.ref || '';
              buildSha = pr.head.sha;
              buildRepo = pr.head.repo.full_name;
            } else if (branch) {
              buildRef = branch;
              try {
                const { data: branchInfo } = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: buildRef,
                });
                buildSha = branchInfo.commit.sha;
              } catch (error) {
                core.setFailed(`找不到出包分支 \`${buildRef}\`：${error.message}`);
                return;
              }
              buildRepo = `${context.repo.owner}/${context.repo.repo}`;
            } else {
              // 默认: PR 合并预览 commit (base 分支 + PR 改动)。
              // PR 有冲突或 GitHub 尚未算出合并结果时该字段为空
              buildRef = pr.base.ref;
              buildSha = pr.merge_commit_sha || '';
              if (!buildSha) {
                core.setFailed(
                  `PR #${prNumber} 当前无法自动合并（可能存在冲突），` +
                  '请先解决冲突后再触发 Package 编译；' +
                  '如需单独编译 PR 分支代码可使用 branch=head。');
                return;
              }
              buildRepo = `${context.repo.owner}/${context.repo.repo}`;
            }

            // 所有组合共享同一时间戳，保证同一触发的产物命名一致 (东八区)
            const now = new Date(Date.now() + 8 * 3600 * 1000);
            const pad = (n) => String(n).padStart(2, '0');
            const datetime = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}` +
              `${pad(now.getUTCDate())}-${pad(now.getUTCHours())}` +
              `${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}`;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'package.yml',
              ref: context.ref,
              inputs: {
                pr_number: String(prNumber),
                socs: socs.join(','),
                arches: arches.join(','),
                jobs,
                requested_by: actor,
                build_sha: buildSha,
                build_ref: buildRef,
                build_repo: buildRepo,
                datetime,
              },
            });

            core.notice(
              `已将 PR #${prNumber} 的 Package 编译分发到 package.yml，` +
              `分支=${buildRef}@${buildSha}，SOC=[${socs.join(',')}]，架构=[${arches.join(',')}]，编译并发=${jobs}。`
            );
