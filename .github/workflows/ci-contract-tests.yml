name: CI 契约测试

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: CI 契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: 执行 CI 契约单元测试
        run: python -m unittest discover -s ci/tests -p 'test_*.py' -b

      - name: 执行分阶段调度集成测试
        run: bash ci/tests/test_run_checks_stage_pipeline.sh
