name: CI 契约测试

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: CI 契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check pyyaml pytest "setuptools>=70.1" wheel packaging

      - name: 执行 Stable 单后端契约与门禁自测
        run: |
          python -m pytest -q tests/test_stable_gates.py tests/test_stable_only_runtime.py tests/test_stable_only_contracts.py tests/test_verify_stable_only_results.py tests/test_aclnn_error_probe.py tests/test_stable_consumer_migration.py tests/test_stable_build_policy.py tests/test_wheel_environment.py torch_custom/fla_npu/test/test_chunk_kda_bwd_intra_wrapper.py torch_custom/fla_npu/test/test_pre_process_fwd_kernel_merged.py::PreProcessStableTest torch_custom/fla_npu/test/test_aclnn_ctypes_abi.py::StableAbiContractTest torch_custom/fla_npu/test/test_runtime_device_guard.py torch_custom/fla_npu/test/test_ascendc_mutation_contract.py
          python -m pytest -q tests/test_opp_overlay.py tests/test_opp_abi_contract.py tests/test_overlay_launcher_capability.py
          python torch_custom/fla_npu/tools/stable_coverage.py --strict
          python torch_custom/fla_npu/tools/stable_ctypes_fallbacks.py
          python tests/atk/chunk_gated_delta_rule_fwd/aclnn_abi_contract.py

      - name: 执行 CI 契约单元测试
        run: python -m unittest discover -s ci/tests -p 'test_*.py' -b

      - name: 执行分阶段调度集成测试
        run: bash ci/tests/test_run_checks_stage_pipeline.sh
