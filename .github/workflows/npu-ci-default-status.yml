name: NPU CI 默认状态

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

jobs:
  mark-not-run:
    name: 检查 Markdown 或标记 NPU CI 未执行
    if: github.event.action != 'edited' || github.event.changes.base.ref
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      statuses: write
      contents: read
    steps:
      - name: 检出状态脚本
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: 检查修改文件并发布状态
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const publishDefault = require('./.github/scripts/default_npu_ci_status.js');
            await publishDefault({github, context, core});
