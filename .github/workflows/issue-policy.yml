name: Issue 规范校验

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, transferred]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 需要复查的 Issue 编号（也可检查由 GITHUB_TOKEN 创建的 Issue）
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-policy-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  validate:
    name: 检查 Issue 字段并同步标签
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出默认分支上的受信任规则
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 校验并更新 Issue
        uses: actions/github-script@v8
        with:
          script: |
            const policy = require('./.github/scripts/issue_policy.js');
            await policy.run({ github, context, core });
