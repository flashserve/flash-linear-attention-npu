api: pytorch
api_type: executor_pre_process_fwd_kernel_merged
version: v2.1
name: pre_process_fwd_kernel_merged
aclnn_name: PreProcessFwdKernelMerged
generate: generator_pre_process_fwd_kernel_merged
dtype_numbers: 1
extra_numbers: 0
standard:
  # 与 CP 组兄弟算子 `chunk_delta_h_bwd_preprocess` 同口径：`hm` 是 FP32 输出，但
  # `m` 链的 `Kw@m`、h 链的 `W@h` / `Kᵀ@v_new` 的中间量都按设计用**模型 dtype** 入 Cube
  # （bf16 操作数 + FP32 累加），链式量的绝对/逐元素判据会被链长放大与极小值污染，
  # 因此按 ATK 原生 `output_dtype_overrides` 声明"按模型 dtype 判"，**不在 executor 里自定义指标**。
  # 注意：`mixed_tolerance_bm` 需要 ATK >= 26.8.8（26.7.8.dev / 26.9.24 的注册表里没有这个名字）。
  acc:
    mixed_tolerance_bm:
      output_dtype_overrides:
        "0": bf16
  perf: not_key
inputs:
  - name: low_precision_marker
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: fp32_marker
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: case_spec
    type: attr
    required: true
    dtypes:
      values: [non_param]
    ranges:
      valid:
        values: ['{"profile":"frozen_by_gen"}']
      invalid:
        values: []
  # ATK 的 BaseBackend.before_call 会丢弃 dtype=non_param 的输入（case_spec 就是 non_param），
  # 因此 executor 运行时真正要用的标量必须**单独**声明为普通属性通道：
  # 与 chunk_delta_h_bwd_preprocess 同一约定（cu_seqlens 是 list，用逗号分隔的 string 下发）。
  - name: cu_seqlens
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ['0,1024']
      invalid:
        values: []
  - name: seed
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [20260818]
      invalid:
        values: []
  - name: dtype
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [bf16]
      invalid:
        values: [fp16, fp32]
  - name: B
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1]
      invalid:
        values: [0, 2, 8]
  - name: HK
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8, 16, 32]
      invalid:
        values: [0, 3, 5, 64]
  - name: HV
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8, 16, 32, 64]
      invalid:
        values: [0, 3, 128]
  - name: T
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [64, 128, 192, 256, 512, 1023, 1024, 2048, 4096, 8192, 11264, 16384, 32768, 65536]
      invalid:
        values: [0, 32]
  - name: K
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [128]
      invalid:
        values: [64, 256]
  - name: V
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [128]
      invalid:
        values: [64, 256]
  - name: chunk_size
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [64]
      invalid:
        values: [32, 128]
  - name: gate
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [g, gk]
      invalid:
        values: [none]
  - name: gate_dtype
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [fp32, bf16]
      invalid:
        values: [fp16]
  - name: soc
    type: attr
    required: true
    dtypes:
      values: [string]
