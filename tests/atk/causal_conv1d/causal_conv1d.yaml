api: pytorch
api_type: executor_causal_conv1d
version: v2.1
name: causal_conv1d
aclnn_name: ""
generate: generator_causal_conv1d
dtype_numbers: 200
extra_numbers: 0
standard:
  acc: mixed_tolerance_bm
  perf: not_key
inputs:
  # ==========================================
  # 第一部分：真实 Tensor 输入声明 (具体 Shape 和 Range 由 gen 动态填充)
  # ==========================================
  - name: x
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[-1.0, 1.0]]
      invalid:
        values: [[5.0, 10.0]]
    shapes:
      dim_numbers:
        values: [-1]
      dim_values:
        values: [[]]

  - name: weight
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[-1.0, 1.0]]
      invalid:
        values: [[5.0, 10.0]]
    shapes:
      dim_numbers:
        values: [-1]
      dim_values:
        values: [[]]

  - name: bias
    type: tensor
    required: false  # 可选输入，由 gen 动态修正
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[-1.0, 1.0]]
      invalid:
        values: [[5.0, 10.0]]
    shapes:
      dim_numbers:
        values: [-1]
      dim_values:
        values: [[]]

  - name: conv_states
    type: tensor
    required: false  # Update 阶段必须，由 gen 依据 run_mode=1 动态修正为 true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[-1.0, 1.0]]
      invalid:
        values: [[5.0, 10.0]]
    shapes:
      dim_numbers:
        values: [-1]
      dim_values:
        values: [[]]

  # (如果需要支持 varlen，还需增加 query_start_loc, has_initial_state 等可选 Tensor)

  # ==========================================
  # 第二部分：保留框架 Marker
  # ==========================================
  - name: low_precision_marker
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: fp32_marker
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]

  # ==========================================
  # 第三部分：测试属性空间 (全量笛卡尔积组合)
  # ==========================================
  - name: run_mode
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [0, 1]  # 0: prefill, 1: decode
      invalid:
        values: []

  - name: activation
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["none", "silu", "swish"]
      invalid:
        values: []

  - name: head_num
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [0, 2, 4, 16]
      invalid:
        values: []

  - name: is_varlen
    type: attr
    required: true
    dtypes:
      values: [bool]
    ranges:
      valid:
        values: [false, true]
      invalid:
        values: []

  - name: B
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 7]
      invalid:
        values: []

  - name: T
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 8, 64, 256, 1024]
      invalid:
        values: []

  - name: D
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [16, 64, 256, 1024, 2048]
      invalid:
        values: []

  - name: W
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [2, 3, 4]
      invalid:
        values: []

  - name: soc
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["ascend960dt"]
      invalid:
        values: []

  - name: route
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["ascendc"]
      invalid:
        values: []