    ranges: {valid: {values: [0]}, invalid: {values: []}}
  - name: case_spec
    type: attr
    required: true
    dtypes: {values: [non_param]}
    ranges: {valid: {values: ['{"op":"chunk_kda_bwd","case_id":0}']}, invalid: {values: []}}
