      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 2 ]
      dim_values:
        - values: [ [ 1, 16 ] ]   # HV
        - values: [ 128 ]         # K
  - name: scale
    type: attr
    required: true
    dtypes:
      values: [float]
    ranges:
      valid:
        values: [1.0]
