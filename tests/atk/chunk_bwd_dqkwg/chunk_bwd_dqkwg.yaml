        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]      # B
        - values: [ [ 1, 16 ] ]    # HV
        - values: [ [ 1, 1024 ] ]  # T
        - values: [ 128 ]          # K
