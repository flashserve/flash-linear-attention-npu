generate: generator_chunk_bwd_dqkwg
dtype_numbers: 100
extra_numbers: 0
standard:
  acc: cv_fused_double_benchmark
inputs:
  # q, k: [B, HK, T, K] —— K 固定 128，HK ∈ [1, 8]
  - name: q
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]      # B
        - values: [ [ 1, 8 ] ]      # HK
        - values: [ [ 1, 1024 ] ]   # T
        - values: [ 128 ]           # K
  - name: k
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]      # B
        - values: [ [ 1, 8 ] ]      # HK
        - values: [ [ 1, 1024 ] ]   # T
        - values: [ 128 ]           # K
  # v, do, dv: [B, HV, T, V] —— HV = HK * n_ratio ∈ [1, 16]，V ∈ {128, 256}
  - name: v
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]       # B
        - values: [ [ 1, 16 ] ]      # HV
        - values: [ [ 1, 1024 ] ]    # T
        - values: [ [ 128, 256 ] ]   # V
  # g: [B, HV, T]
  - name: g
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 3 ]
      dim_values:
        - values: [ [ 1, 5 ] ]      # B
        - values: [ [ 1, 16 ] ]    # HV
        - values: [ [ 1, 1024 ] ]  # T
  # h, dh: [B, HV, num_chunks, K, V] —— num_chunks = ceil(T / chunk_size) ∈ [1, 16]
  - name: h
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
