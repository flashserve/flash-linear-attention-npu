        - values: [ [ 1, 16 ] ]      # HV
        - values: [ [ 1, 16 ] ]      # num_chunks
        - values: [ 128 ]            # K
        - values: [ [ 128, 256 ] ]   # V
  - name: do
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]       # B
        - values: [ [ 1, 16 ] ]      # HV
        - values: [ [ 1, 1024 ] ]    # T
        - values: [ [ 128, 256 ] ]   # V
  - name: dh
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 5 ]
      dim_values:
        - values: [ [ 1, 5 ] ]       # B
        - values: [ [ 1, 16 ] ]      # HV
        - values: [ [ 1, 16 ] ]      # num_chunks
        - values: [ 128 ]            # K
        - values: [ [ 128, 256 ] ]   # V
  - name: dv
    type: tensor
    required: true
    dtypes:
      values: [bf16, fp16]
    ranges:
      valid:
        values: [ [ -5, 5 ] ]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [ 4 ]
      dim_values:
        - values: [ [ 1, 5 ] ]       # B
        - values: [ [ 1, 16 ] ]      # HV
        - values: [ [ 1, 1024 ] ]    # T
        - values: [ [ 128, 256 ] ]   # V
  # cu_seqlens: [N+1]，变长模式累计长度
  - name: cu_seqlens
    type: tensor
    required: true
    dtypes:
      values: [int64]
