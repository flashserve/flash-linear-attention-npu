  - name: transpose_state_layout
    type: attr
    required: true
    dtypes:
      values: [bool]
    ranges:
      valid:
        values: [false]
      invalid:
        values: []
  - name: qkv_type
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
